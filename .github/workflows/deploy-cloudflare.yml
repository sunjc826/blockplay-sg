# `main` is what deploys, and nothing else gates it, so this workflow runs the
# same checks a local push runs before it uploads anything, and verifies the
# live site afterwards. See docs/CLOUDFLARE.md.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # Redeploy the current main without a commit: reverting a bad Worker secret,
  # or re-running after a Cloudflare outage.
  workflow_dispatch:

# One deploy at a time, and the latest push wins: a newer run stops the one in
# front of it instead of waiting twenty minutes for a build nobody wants any
# more. The run that did the stopping is by definition a later commit and
# deploys in its place. Should the stop land inside `wrangler deploy` itself (a
# window of a few seconds), the Worker stays on whichever version it had last
# finished publishing, and the newer run replaces it either way.
concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Wrangler's first run otherwise asks about telemetry, which CI cannot answer.
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    # A fork's own main has no credentials and no business deploying this Worker.
    if: github.repository == 'sunjc826/blockplay-sg'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Before the four minutes of install, build and tests, so a missing
      # credential fails with the instruction instead of a Wrangler auth dump.
      - name: Check the deploy credential is present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing the CLOUDFLARE_API_TOKEN repository secret. Create one from Cloudflare's 'Edit Cloudflare Workers' template, scoped to the account in wrangler.jsonc, then add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Every commit, but only this commit's files: the deploy stamp is the
      # commit's depth on main, which a shallow clone cannot count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # Deploys go in commit order (scripts/deploy-order.mjs). If the live site
      # is already this commit or a later one (a deploy by hand, or a later run
      # that got there first) there is nothing to do, and finding that out here
      # saves the fifteen minutes of tests. A run started by hand from the
      # Actions tab is a deliberate redeploy and always goes ahead.
      - name: Check the live site is not already ahead
        id: order
        env:
          CLOUDFLARE_APP_ORIGIN: ${{ vars.CLOUDFLARE_APP_ORIGIN || 'https://blockplaysg.fun' }}
          DEPLOY_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/deploy-order.mjs guard

      # The pnpm version comes from packageManager in package.json, so it cannot
      # drift from the one the lockfile was written with.
      - uses: pnpm/action-setup@v4
        if: steps.order.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.order.outputs.skip != 'true'
        with:
          # The version docs/CLOUDFLARE.md pins for Cloudflare's own build image.
          node-version: "24.21.0"
          cache: pnpm

      # minimumReleaseAge in pnpm-workspace.yaml only governs resolution; a
      # frozen install takes exactly what the lockfile already pinned.
      - run: pnpm install --frozen-lockfile
        if: steps.order.outputs.skip != 'true'

      - run: pnpm typecheck
        if: steps.order.outputs.skip != 'true'
      - run: pnpm test
        if: steps.order.outputs.skip != 'true'

      # Street View is optional and its key is a build-time value. Without the
      # secret the cloudflare build disables it, which is the current behaviour.
      - name: Build the Worker's assets
        if: steps.order.outputs.skip != 'true'
        env:
          GOOGLE_MAPS_DEMO_API_KEY: ${{ secrets.GOOGLE_MAPS_DEMO_API_KEY }}
        run: pnpm build:cloudflare && node scripts/deploy-order.mjs stamp

      # The menu compiles the range's shaders before the player picks a district
      # (src/game/shader-warm.ts), from a list of what a real load links. Recorded
      # here, from this build, so the list cannot fall behind the shaders it
      # names. It only makes loading faster: without it the site works as it did,
      # so a failure here is reported and the deploy goes ahead.
      - name: Record the range's shaders for the menu warm-up
        if: steps.order.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: pnpm shaders:capture

      # `pnpm deploy:cloudflare` without its rebuild: the bundle above is exactly
      # what ships. Runtime secrets (OPENAI_API_KEY) are set once with
      # `wrangler secret put` and survive every later deploy, so nothing here
      # needs to know them.
      # Asked again: twenty minutes have passed, and a deploy by hand may have
      # published a later commit in the meantime.
      - name: Check again that the live site is not ahead
        id: late
        if: steps.order.outputs.skip != 'true'
        env:
          CLOUDFLARE_APP_ORIGIN: ${{ vars.CLOUDFLARE_APP_ORIGIN || 'https://blockplaysg.fun' }}
          DEPLOY_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/deploy-order.mjs guard

      - name: Deploy
        if: steps.order.outputs.skip != 'true' && steps.late.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: pnpm exec wrangler deploy

      # Routing, production assets, the service worker, the manifest and the API
      # origin checks, against the public URL — the custom domain people actually
      # open, so a broken route there fails the run even when the workers.dev
      # origin is fine. It spends no companion, voice or map credits. The
      # CLOUDFLARE_APP_ORIGIN variable overrides the default.
      #
      # A new version takes a few seconds to propagate, and mid-propagation an
      # edge can serve the new index.html beside the previous version's asset
      # manifest: the hashed bundle it names is not there yet, so it falls
      # through to the SPA handler and the check sees HTML where JavaScript
      # should be. Hence a settle and a few attempts before a failure is
      # believed. A site that is genuinely broken fails all of them.
      - name: Verify the deployment
        if: steps.order.outputs.skip != 'true' && steps.late.outputs.skip != 'true'
        env:
          CLOUDFLARE_APP_ORIGIN: ${{ vars.CLOUDFLARE_APP_ORIGIN || 'https://blockplaysg.fun' }}
        run: |
          sleep 10
          for attempt in 1 2 3 4 5; do
            if pnpm test:cloudflare; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then
              echo "::notice::Attempt $attempt failed. Retrying in 15s in case the new version is still propagating."
              sleep 15
            fi
          done
          echo "::error::The deployed site failed its checks after five attempts over a minute, so this is not propagation. The Worker is live on the version deployed above; the assertion names what it served."
          exit 1
