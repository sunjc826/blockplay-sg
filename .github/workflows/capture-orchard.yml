# Legacy filename retained so saved links and the existing Actions entry work.
name: Capture district references

on:
  workflow_dispatch:
    inputs:
      district:
        description: District with a committed browser capture plan
        required: true
        type: choice
        options: [marina-bay, raffles-place, queenstown, chinatown, kampong-glam, jurong-lake, changi, upper-thomson, punggol, harbourfront, sentosa, geylang, tuas, woodlands, tampines, toa-payoh, bukit-timah, bishan, orchard]
  push:
    branches: [main]
    paths: ['reconstruction/*-browser-plan.json']

permissions:
  # Owner authorized reference/ledger commits to main on 2026-09-25.
  contents: write
  actions: read

# All districts share one ledger. Serialize runs and take the latest cache.
concurrency:
  group: street-view-reference-capture
  cancel-in-progress: false

jobs:
  capture:
    if: github.repository == 'sunjc826/blockplay-sg' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select only changed district plans (or one manual district)
        id: selection
        run: node scripts/capture-workflow.mjs select
      # One-time recovery of already-paid Orchard captures; no Google calls.
      - name: Recover Orchard cache if selected and not yet committed
        if: steps.selection.outputs.orchard == 'true' && hashFiles('reconstruction/orchard/references/junction-road-02-0.png') == ''
        uses: actions/download-artifact@v4
        with:
          name: orchard-references-36118178047-1
          run-id: 36118178047
          github-token: ${{ github.token }}
          path: /tmp/orchard-recovery
      - name: Reconcile recovery without resetting request history
        if: steps.selection.outputs.orchard == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          recovered = Path('/tmp/orchard-recovery')
          if recovered.exists():
              target = Path('reconstruction/api-usage.json')
              old = json.loads(target.read_text())
              new = json.loads((recovered / 'api-usage.json').read_text())
              # Preserve newer policy fields and reconcile attempts by ID.
              attempts = {entry['id']: entry for entry in old['attempts']}
              for entry in new['attempts']:
                  if entry['id'] in attempts:
                      assert attempts[entry['id']] == entry, 'Conflicting ledger event'
                  else:
                      old['attempts'].append(entry)
                      attempts[entry['id']] = entry
              target.write_text(json.dumps(old, indent=2) + '\n')
              shutil.copytree(recovered / 'orchard/references', 'reconstruction/orchard/references', dirs_exist_ok=True)
          PY
      - name: Validate plans and check caches before starting Chrome
        if: steps.selection.outputs.has_plans == 'true'
        id: preflight
        run: node scripts/capture-workflow.mjs preflight
      - name: Check capture credential only when new images are needed
        if: steps.preflight.outputs.needs_capture == 'true'
        env:
          GOOGLE_MAPS_DEMO_API_KEY: ${{ secrets.GOOGLE_MAPS_DEMO_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_DEMO_API_KEY" ]; then
            echo "::error::Set the GOOGLE_MAPS_DEMO_API_KEY repository secret."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.needs_capture == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.preflight.outputs.needs_capture == 'true'
      - name: Capture selected districts sequentially
        if: steps.preflight.outputs.needs_capture == 'true'
        env:
          GOOGLE_MAPS_DEMO_API_KEY: ${{ secrets.GOOGLE_MAPS_DEMO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::Import partial artifacts before starting a new capture run."
            exit 1
          fi
          pnpm dev --host 127.0.0.1 > /tmp/capture-vite.log 2>&1 &
          vite_pid=$!
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader --use-angle=swiftshader --remote-debugging-port=9223 --user-data-dir=/tmp/capture-chrome about:blank > /tmp/capture-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$vite_pid" "$chrome_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/scripts/pages/capture-streetview.html > /dev/null && curl -fsS http://127.0.0.1:9223/json/version > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-workflow.mjs run
      - name: Stage only selected district references and shared ledger
        if: always() && steps.selection.outputs.has_plans == 'true'
        run: node scripts/capture-workflow.mjs stage
      - name: Preserve selected output even after partial failure
        if: always() && steps.selection.outputs.has_plans == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: district-references-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/capture-output/
          retention-days: 30
          if-no-files-found: error
      - name: Commit reference cache and request ledger
        if: always() && steps.selection.outputs.has_plans == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Save selected district references and request ledger"
            # Fail on concurrent changes; never overwrite main or the ledger.
            git push origin HEAD:main
          fi
