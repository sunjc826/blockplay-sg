<!doctype html>
<!-- The throw and the plate as a contact sheet through the viewmodel camera, for checking poses by eye:
     ?film=throw | lob | plates | eat | bandage | medkit | ammo (default throw) &item=grenade-frag &cols=6 &only=4,9 (just those frames). Cut straight from the real motion. -->
<html><body style="margin:0;background:#111"><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {createGrenadeViewmodel} from '/src/game/grenade-models.ts';
import {createSupplyViewmodel} from '/src/game/fps-supply-viewmodel.ts';
import {GRENADE_MIN_WINDUP as W0,GRENADE_READY_SECONDS as R,GRENADE_RECOVERY_SECONDS as AFTER,GRENADE_SWING_SECONDS as S} from '/src/game/fps-grenade-motion.ts';
const params=new URLSearchParams(location.search),film=params.get('film')||'throw',id=params.get('item')||'grenade-frag',cols=Number(params.get('cols')||6);
const scene=new THREE.Scene();scene.background=new THREE.Color('#8fa7b3');scene.add(new THREE.HemisphereLight('#e4efff','#576350',2.1));
const sun=new THREE.DirectionalLight('#fff4dd',2.5);sun.position.set(1,2,1);scene.add(sun);
const grenade=createGrenadeViewmodel(scene),supply=createSupplyViewmodel(scene);
const hold=(ready,cooked,swingAt=null,under=0,pinned=true)=>({id,hold:{ready,cooked,pinned,swingAt,under,fuseLeft:3}});
const under=film==='lob'?1:0;
const only=params.get('only')?.split(',').map(Number),all=film!=='throw'&&film!=='lob'
  ?[.05,.1,.14,.2,.3,.38,.44,.5,.56,.62,.68,.72,.74,.76,.78,.82,.86,.9,.94,.98].map(p=>({label:'p'+p,draw:()=>supply.update(film,p)}))
  :[[.08,0,null,0,false],[.2,0,null,0,false],[.35,0,null,0,false],[.35,.05],[.35,.085],[.35,.12],[.35,.16],[.35,.2],[.35,W0],[.35,.3],[.35,1],[.35,1+S*.3,1],[.35,1+S*.6,1],[.35,1+S*.85,1],[.35,1+S,1]]
    .map(([r,c,s=null,,p=true])=>({label:`r${r} c${c}`,draw:()=>grenade.update(hold(r,c,s,under,p))}))
    .concat([.03,.07,.12,.18,.26,.34,.42].map(t=>({label:`t+${t}`,draw:()=>grenade.update({id,release:{thrown:true,elapsed:t,under}})})));
const frames=only?only.map(i=>all[i]):all,rows=Math.ceil(frames.length/cols),W=Number(params.get('w')||1800),H=Number(params.get('h')||Math.round(W/cols*9/16)*rows),w=W/cols,h=H/rows;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.append(renderer.domElement);Object.assign(renderer.domElement.style,{display:'block',width:'100vw',height:'auto'});renderer.setScissorTest(true);
const eye=new THREE.PerspectiveCamera(65,w/h,.01,3);
frames.forEach((f,i)=>{grenade.update(null);supply.update(null,0);f.draw();const x=(i%cols)*w,y=(rows-1-Math.floor(i/cols))*h;renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w-2,h-2);renderer.render(scene,eye);
  const tag=document.createElement('div');tag.textContent=f.label;tag.style.cssText=`position:absolute;left:${(i%cols)/cols*100}vw;top:${Math.floor(i/cols)/rows*100*(H/W)}vw;font:11px monospace;color:#fff;text-shadow:0 0 2px #000`;document.body.append(tag);});
window.ready=true;
</script></body></html>
