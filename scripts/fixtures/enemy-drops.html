<!doctype html><html><head><meta charset="utf-8"><title>Enemy drops</title><style>
body{margin:0;background:#17231e;color:#e8efe9;font:14px system-ui}#world{height:560px;width:100vw;position:relative}canvas{display:block}#log{padding:8px 14px;white-space:pre-wrap;font:12px ui-monospace,monospace}
</style></head><body><div id="world"></div><div id="log"></div><script type="module">
// A live Marina Bay expedition for checking enemy drops. The autopilot fights;
// window.state reports bots, their weapons and every drop on the ground.
// window.takeDropHere(variant) leaves a drop at the player's feet and takes it,
// through the same loot path the E key uses.
import { createFpsEngine } from '/src/game/fps-engine.ts';
import { createProfile, resolveLoadout } from '/src/game/armory-state.ts';
import { createExpeditionLoot } from '/src/game/expedition-loot.ts';
let profile = createProfile();
const loot = createExpeditionLoot('enemy-drops');
window.loot = loot;
window.engine = createFpsEngine(document.querySelector('#world'), hud => { window.hud = hud; }, { loadout: resolveLoadout(profile),
  expedition: { zone: 'marina-bay', profile, loot, onEquipment(next) { profile = next; window.fieldProfile = next; }, onTravel() {} } });
window.state = () => ({
  phase: hud?.phase, weapon: hud?.weapon, carried: hud?.carriedWeapons,
  bots: hud?.arena?.actors.filter(a => a.bot).map(a => `${a.name}:${a.alive ? 'up' : 'down'}:${a.variant}`),
  drops: loot.remaining('marina-bay').filter(item => item.dropped).map(item => `${item.name}@${item.x.toFixed(1)},${item.z.toFixed(1)}`),
  notice: hud?.lootNotice, prompt: hud?.lootPrompt,
});
window.takeDropHere = variant => {
  const self = hud.arenaSelf; loot.drop('marina-bay', variant, { x: self.x, z: self.z, y: Math.max(0, self.y - 1.75) });
  window.engine.interactLoot(); return window.state();
};
setInterval(() => { document.querySelector('#log').textContent = JSON.stringify(window.state?.(), null, 1); }, 500);
window.ready = true;
</script></body></html>
