<!doctype html><html><head><meta charset="utf-8"><title>District street props review</title><style>body{margin:0;background:#1f302a;font:14px system-ui}header{position:absolute;top:20px;left:20px;padding:12px 16px;background:#eceddf;color:#263c35}canvas{display:block}</style></head><body><header id="label"></header><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { getRegion } from '/src/game/regions.ts';
const params=new URLSearchParams(location.search),region=getRegion(params.get('region')||'chinatown'),world=region.build();
const wanted=params.get('prop')||'crate';
const root=[...world.scene.getObjectByName('District street props').children,...world.scene.getObjectByName('Reactive street decorations').children].find(p=>p.userData.streetProp===wanted);
if(!root)throw Error('Missing prop '+wanted);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.05,600),direction=new THREE.Vector3(0,0,1).applyQuaternion(root.quaternion);
camera.position.copy(root.position).addScaledVector(direction,4).add(new THREE.Vector3(1,2,0));camera.lookAt(root.position.clone().add(new THREE.Vector3(0,.65,0)));
world.scene.updateMatrixWorld(true);
document.querySelector('#label').textContent=region.name+' / '+root.name+' / '+world.scene.userData.streetPropPlacements.length+' props';
let last=performance.now(),time=0;
function render(now){time+=Math.min(.05,(now-last)/1000);last=now;world.animate(time);renderer.render(world.scene,camera);requestAnimationFrame(render);window.ready=true;}
requestAnimationFrame(render);
window.review={world,root,renderer,camera,THREE};
window.addEventListener('pagehide',()=>{world.dispose();renderer.dispose();});
</script></body></html>
