<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Marina anti-aliasing review</title><style>body{margin:0;background:#000}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
const { buildMarinaScene } = await import(/* @vite-ignore */ new URLSearchParams(location.search).has('baseline') ? '/.cache/marina-aa/baseline-scene.ts' : '/src/game/marina-scene.ts');
import { createWorldOcclusion } from '/src/game/world-occlusion.ts';
import { setGraphicsSettings } from '/src/game/graphics-settings.ts';
const world=buildMarinaScene(), renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.autoClear=false;renderer.info.autoReset=false;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.append(renderer.domElement);
world.stamps.forEach(s=>s.visible=false);
const camera=new THREE.PerspectiveCamera(65,1.5,.08,1200),post=createWorldOcclusion(renderer,world.scene,camera);
const materials=new Set();world.scene.traverse(o=>{if(o.isMesh)for(const m of [o.material].flat())materials.add(m);});
const trim=[...materials].filter(m=>m.userData.thinDetail).map(m=>({m,hook:m.onBeforeCompile,key:m.customProgramCacheKey,transparent:m.transparent,depthWrite:m.depthWrite}));
const waters=[...materials].filter(m=>m.userData.fpsWater&&m.fragmentShader).map(m=>({m,shader:m.fragmentShader}));
const views={bay:[[-26,1.7,40],[70,28,-15]],hotel:[[53,29,-70],[90,29,-16]],rails:[[-10,1.3,32],[10,.3,25]],museum:[[61.8,3.6,-46.8],[81,12,-66]],water:[[-30,3,20],[-12,-.24,-20]]};
let options={density:1.35,smaa:false,filter:true,ao:true,bloom:true,view:'bay',width:1200,height:800},baselineWater;
function render(offset=0){
 renderer.info.reset();const [eye,look]=views[options.view];camera.position.set(eye[0]+offset,eye[1],eye[2]);camera.lookAt(look[0]+offset,look[1],look[2]);camera.updateMatrixWorld();
 world.animate(10);post.render(options.ao,options.bloom,false,false,'off');
 return {calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,smaa:post.smaaEnabled,width:renderer.domElement.width,height:renderer.domElement.height,textures:renderer.info.memory.textures};
}
function configure(next={}){
 options={...options,...next};setGraphicsSettings({smaa:options.smaa});renderer.setPixelRatio(options.density);renderer.setSize(options.width,options.height);camera.aspect=options.width/options.height;camera.updateProjectionMatrix();post.setSize();
 for(const t of trim){t.m.onBeforeCompile=options.filter?t.hook:()=>{};t.m.customProgramCacheKey=options.filter?t.key:()=> 'unfiltered-review';t.m.transparent=options.filter?t.transparent:false;t.m.depthWrite=options.filter?t.depthWrite:true;t.m.needsUpdate=true;}
 for(const w of waters){w.m.fragmentShader=options.filter?w.shader:(baselineWater||w.shader);w.m.needsUpdate=true;}
 return render();
}
function pixels(){const c=document.createElement('canvas');c.width=options.width;c.height=options.height;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(renderer.domElement,0,0,c.width,c.height);return ctx.getImageData(0,0,c.width,c.height).data;}
async function settle(){for(let i=0;i<4;i++){await new Promise(requestAnimationFrame);render();}}
async function benchmark(next){configure(next);await settle();const gl=renderer.getContext(),ext=gl.getExtension('EXT_disjoint_timer_query_webgl2'),times=[],gpu=[];
 for(let i=0;i<36;i++){
  await new Promise(requestAnimationFrame);const q=ext?gl.createQuery():null;if(q)gl.beginQuery(ext.TIME_ELAPSED_EXT,q);
  const start=performance.now();render(i*.003);if(q)gl.endQuery(ext.TIME_ELAPSED_EXT);gl.finish();times.push(performance.now()-start);
  if(q){for(let j=0;j<60&&!gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE);j++)await new Promise(requestAnimationFrame);if(!gl.getParameter(ext.GPU_DISJOINT_EXT)&&gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE))gpu.push(gl.getQueryParameter(q,gl.QUERY_RESULT)/1e6);gl.deleteQuery(q);}
 }
 const stats=a=>{a.sort((a,b)=>a-b);return a.length?{median:a[Math.floor(a.length*.5)],p95:a[Math.floor(a.length*.95)]}:null;};
 return {options:{...options},synchronizedMs:stats(times),gpuMs:stats(gpu),...render()};
}
async function stability(){await settle();const a=pixels();for(let i=0;i<5;i++)render();const b=pixels();return a.reduce((n,v,i)=>n+(v!==b[i]),0);}
const gl=renderer.getContext(),debug=gl.getExtension('WEBGL_debug_renderer_info');
window.review={configure,render,settle,benchmark,stability,pixels,renderer,post,world,camera,options:()=>options,setBaseline:shader=>baselineWater=shader,gpu:debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)};
configure();window.ready=true;
</script></body></html>
