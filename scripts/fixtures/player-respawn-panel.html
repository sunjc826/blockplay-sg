<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player respawn authority and UI verification</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font:14px system-ui}#stage{height:100dvh;position:relative;background:#12242b}#overlay{position:absolute;inset:0}#start{position:absolute;bottom:15px;left:15px;z-index:25;padding:12px}</style></head>
<body><div id="stage"><div id="overlay"></div><button id="start">Enter / Resume</button></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {createArena} from '/src/game/arena-rules.ts';
import {moveInMarina} from '/src/game/marina-collision.ts';
import ExpeditionRespawn from '/src/components/ExpeditionRespawn.tsx';
const root=createRoot(document.getElementById('overlay'));
const site=(id,x,initialOwner='armed-forces')=>({id,name:id,kind:'garage',x,y:0,z:0,initialOwner,deployment:{x,z:0,yaw:.7}});
const authority=createArena([],0,'mixed',{bounds:{minX:-200,maxX:200,minZ:-200,maxZ:200},move:moveInMarina,spawns:[{x:0,z:100}],endless:true,reinforcements:true,facilities:{sites:[site('West command',-70),site('East motor pool',70),site('Black Kite post',140,'mercenaries')]}});
authority.addPlayer('p','Player');authority.setPlayerVitals('p',{health:0});
let phase='ready';
function publish(){
 const self=authority.snapshot().actors.find(a=>a.id==='p');
 window.hud={phase,arenaSelf:self,respawn:authority.playerRespawn('p')};
 root.render(phase==='playing'&&!self.alive?React.createElement(ExpeditionRespawn,{view:window.hud.respawn,seconds:self.respawnIn,onChoose:id=>{authority.choosePlayerRespawn('p',id);publish();},onAutomatic:value=>{authority.setPlayerAutoRespawn('p',value);publish();},onMenu:()=>{phase='paused';publish();}}):null);
}
setInterval(()=>{if(phase==='playing'){authority.step(.05);publish();}},50);
document.getElementById('start').onclick=()=>{phase='playing';publish();};publish();
</script></body></html>
