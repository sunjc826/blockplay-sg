<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aerial respawn authority and UI verification</title>
<style>html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden}#world,#overlay{position:absolute;inset:0}#overlay{pointer-events:none}#start{position:absolute;bottom:15px;right:15px;z-index:25;padding:12px}</style></head>
<body><div id="stage" class="fps-game expedition-game"><div id="world"></div><div id="overlay"></div><button id="start">Enter / Resume</button></div><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';
import '/src/styles.css';import '/src/components/expedition.css';
import {createFpsEngine} from '/src/game/fps-engine.ts';
import {createProfile} from '/src/game/armory-state.ts';
import {createExpeditionLoot} from '/src/game/expedition-loot.ts';
import ExpeditionRespawn from '/src/components/ExpeditionRespawn.tsx';
import ExpeditionDeployment from '/src/components/ExpeditionDeployment.tsx';
import {createFacilities} from '/src/game/facilities.ts';
const params=new URLSearchParams(location.search), initial=params.has('initial'), infrastructure=new Map();
if(params.has('no-allies')){const saved=createFacilities([{id:'queenstown-allied-post',name:'Post',kind:'command',initialOwner:'mercenaries',x:0,y:0,z:0,deployment:{x:0,z:0,yaw:0}}]).snapshot();infrastructure.set('queenstown',{facilities:saved});}
const root=createRoot(document.querySelector('#overlay')),button=document.querySelector('#start');
window.engine=createFpsEngine(document.querySelector('#world'),hud=>{
 window.hud=hud;button.hidden=initial||hud.phase==='playing';
 root.render(hud.deployment?.canChoose?React.createElement(ExpeditionDeployment,{zone:'queenstown',deployment:hud.deployment,onChoose:id=>engine.chooseDeployment(id),onZoom:factor=>engine.zoomDeployment(factor),onResetView:()=>engine.resetDeploymentView()}):hud.phase==='playing'&&hud.arenaSelf?.alive===false&&hud.respawn?React.createElement(ExpeditionRespawn,{
  view:hud.respawn,seconds:hud.arenaSelf.respawnIn,
  onChoose:id=>engine.chooseRespawn(id),onAutomatic:value=>engine.setAutoRespawn(value),onMenu:()=>engine.pause(),
  onZoom:factor=>engine.zoomDeployment(factor),onResetView:()=>engine.resetDeploymentView(),
 }):null);
},{region:'queenstown',expedition:{zone:'queenstown',infrastructure,checkpoint:initial?undefined:{health:0,armor:0,weapon:0,ammunition:[]},profile:createProfile(),loot:createExpeditionLoot('aerial-respawn-review'),
 onTravel(){},onEquipment(){},onVendorPurchase(){return{ok:false,message:'Fixture'};}}});
button.onclick=()=>{engine.configureDebug({combatEvents:false,regeneration:false});engine.start();};
</script></body></html>
