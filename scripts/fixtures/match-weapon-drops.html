<!doctype html><style>body{margin:0;background:#17231e;color:white;font:16px sans-serif}.fps-game{position:relative}#world{height:calc(100vh - 44px);width:100vw}button{padding:12px}</style>
<button id="enter">Enter match</button><div class="fps-game"><div id="world"></div><div id="hud"></div></div><script type="module">
import React from '/node_modules/.vite/deps/react.js';
import ReactDOM from '/node_modules/.vite/deps/react-dom_client.js';
import RefreshRuntime from '/@react-refresh';
RefreshRuntime.injectIntoGlobalHook(window);window.$RefreshReg$=()=>{};window.$RefreshSig$=()=>type=>type;window.__vite_plugin_react_preamble_installed__=true;
const {default:FpsLootCard}=await import('/src/components/FpsLootCard.tsx');
await import('/src/components/expedition.css');
await import('/src/styles.css');
import {createFpsEngine} from '/src/game/fps-engine.ts';
import {createProfile,resolveLoadout} from '/src/game/armory-state.ts';
import {itemById} from '/src/game/armory-catalog.ts';
import {createArena} from '/src/game/arena-rules.ts';
import {TDM_AREAS} from '/src/game/arena-match.ts';
import {SMITH_CONTROL_SITES} from '/src/game/hardpoint.ts';
const mode=new URLSearchParams(location.search).get('mode')??'ffa', area=TDM_AREAS.find(a=>a.id==='smith-street');
const environment={bounds:mode==='ffa'?{minX:-200,maxX:200,minZ:-200,maxZ:200}:area.bounds,move:(p,dx,dz)=>({x:p.x+dx,z:p.z+dz}),
 spawns:mode==='ffa'?[{x:-103,z:95.5}]:[...area.spawns.alpha,...area.spawns.bravo],
 ...(mode==='tdm'?{teamDeathmatch:area}:mode==='hardpoint'?{hardpoint:{area,sites:SMITH_CONTROL_SITES}}:{})};
let collecting=false;
window.sim=createArena([],0,'mixed',environment,undefined,undefined,()=>collecting?Infinity:0);
const profile=createProfile(),kit=resolveLoadout(profile);window.original=JSON.stringify(profile);
sim.addPlayer('guest','Player',0,0,kit.weapons,undefined,false,kit.carriedFamilies);
const handlers=new Set();let started=false;
const publish=()=>{const packet={type:'arena-state',snapshot:sim.snapshot(),started,matchId:'fixture'};for(const cb of handlers)cb('host',structuredClone(packet));};
const session={id:'guest',name:'Player',role:'guest',getPeers:()=>[{id:'host',name:'Host'}],isConnected:()=>true,onPeers:()=>()=>{},close(){},
 subscribe:cb=>{handlers.add(cb);return()=>handlers.delete(cb)},send:p=>{
 if(p.type==='arena-input')sim.setInput('guest',p.input);
 if(p.type==='arena-shot')sim.shoot('guest',p.origin,p.direction,p.weapon,p.maxDistance);
 if(p.type==='arena-reload')sim.reloadPlayer('guest',p.weapon,p.capacity);
 if(p.type==='arena-pickup'){collecting=true;window.accepted=sim.pickupWeapon('guest',p.id);collecting=false;}
 if(p.type==='arena-hello'||p.type==='arena-pickup')publish();
 }};
const root=ReactDOM.createRoot(document.querySelector('#hud'));window.touch=false;
window.renderHud=()=>root.render(React.createElement(FpsLootCard,{hud:window.hud,touch:window.touch,actions:window.touch?{take:()=>engine.interactLoot()}:undefined}));
window.engine=createFpsEngine(document.querySelector('#world'),hud=>{window.hud=hud;window.renderHud();},{loadout:kit,arena:{session,profile,botCount:0,environment,
 ...(mode==='ffa'?{}:{match:{mode:mode==='tdm'?'team-deathmatch':'hardpoint',area:'smith-street'}})}});
window.profile=profile;
setInterval(()=>{sim.step(.05);publish()},50);
document.querySelector('#enter').onclick=()=>{started=true;publish();engine.start()};
window.makeDrop=(catalogId='g36-rifle')=>{
 sim.removePlayer('donor');const next=createProfile(),family=itemById(catalogId).family;next.owned.push(catalogId);next.guns[family].variant=catalogId;next.carry.main=family;
 const kit=resolveLoadout(next);sim.addPlayer('donor','Donor',0,0,kit.weapons,undefined,false,kit.carriedFamilies);
 const player=sim.snapshot().actors.find(a=>a.id==='guest'),x=player.x-Math.sin(hud.yaw)*1.5,z=player.z-Math.cos(hud.yaw)*1.5;
 for(let i=0;i<500;i++){const donor=sim.snapshot().actors.find(a=>a.id==='donor');if(Math.hypot(donor.x-x,donor.z-z)<.05)break;sim.setInput('donor',{...donor,x,z,playing:true});sim.step(.05)}
 sim.setPlayerVitals('donor',{health:0});publish();return sim.snapshot().weaponDrops.at(-1);
};
window.die=()=>{sim.setPlayerVitals('guest',{health:0});publish()};
</script>
