<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Weather quality review</title></head><body style="margin:0"><script type="module">
import * as THREE from 'three';
import { createWorldOcclusion } from '/src/game/world-occlusion.ts';
import { createRainEffects } from '/src/game/rain-effects.ts';
import { createGrass } from '/src/game/ground-cover.ts';
import { getRegion } from '/src/game/regions.ts';
import { createWorldAtmosphere } from '/src/game/world-atmosphere.ts';
import { setEnvironmentSettings } from '/src/game/environment-settings.ts';
import { setGraphicsSettings } from '/src/game/graphics-settings.ts';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,800);renderer.autoClear=false;renderer.info.autoReset=false;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(60,1.5,.08,400),params=new URLSearchParams(location.search),district=params.get('district');
let scene,atmosphere,world,rain,grass;
if(district){
 const region=getRegion(district);world=region.build();world.stamps.forEach(s=>s.visible=false);scene=world.scene;
 camera.position.set(region.spawn.x,1.7,region.spawn.z);camera.rotation.y=region.spawn.yaw;
 setEnvironmentSettings({timeOfDay:'noon',weather:params.get('weather')||'monsoon',celebration:'none',reducedEffects:false});
 atmosphere=createWorldAtmosphere(scene,region.stamps,world.obstacles,false,renderer);grass=scene.userData.groundCover.grass;
}else{
 scene=new THREE.Scene();scene.background=new THREE.Color('#81949e');camera.position.set(0,2,10);camera.lookAt(0,1,-12);
 scene.add(new THREE.HemisphereLight('#d5e7f1','#475541',2));const sun=new THREE.DirectionalLight('#e5e9e8',1);sun.position.set(30,70,20);scene.add(sun);
 const floor=new THREE.Mesh(new THREE.BoxGeometry(16,.1,220),new THREE.MeshStandardMaterial({color:'#43505a',roughness:.55}));floor.position.y=-.05;scene.add(floor);
 for(const x of [-50,50]){const lawn=new THREE.Mesh(new THREE.BoxGeometry(84,.1,220),new THREE.MeshStandardMaterial({color:'#718650'}));lawn.position.set(x,-.05,0);scene.add(lawn);}
 for(const [x,color]of[[-4,'#e33d24'],[0,'#4290ee'],[4,'#eec03e']]){const box=new THREE.Mesh(new THREE.BoxGeometry(2.5,5,3),new THREE.MeshStandardMaterial({color}));box.position.set(x,2.5,-14);scene.add(box);}
 for(let i=0;i<6;i++){const box=new THREE.Mesh(new THREE.BoxGeometry(9,12+i*2,10),new THREE.MeshStandardMaterial({color:i%2?'#829194':'#4f6972'}));box.position.set(i%2?-35:35,6+i,-25-i*18);scene.add(box);}
 scene.userData.wetGround={surface:(x,z)=>Math.abs(x)<8?0:null,exposed:()=>0,wetness:1,time:1};
 rain=createRainEffects(scene,()=>0);grass=createGrass(scene,{minX:-110,maxX:110,minZ:-110,maxZ:110},x=>Math.abs(x)>8?0:null);
}
const post=createWorldOcclusion(renderer,scene,camera);let current={detail:'high',reflections:false,rain:true,ao:true,wetness:1,water:false},time=0;
window.draw=(options={},dt=0)=>{
 current={...current,...options};renderer.info.reset();
 setGraphicsSettings({rainDetail:current.detail,grassDetail:current.detail,waterDetail:current.detail});
 if(atmosphere){world.animate(time);atmosphere.update(dt,camera,Date.UTC(2026,10,8,12)+time*1000);renderer.toneMappingExposure=atmosphere.light.lighting.exposure;}
 else{rain.update(dt,camera.position,current.rain?.7:0,2,false,current.detail);grass.update(camera,time,false,false,current.detail);scene.userData.wetGround.wetness=current.wetness;}
 time+=dt;post.render(current.ao,false,current.reflections,current.water);
 return {ripples:atmosphere?.root.userData.waterRipples??0,waterReflections:post.waterReflectionsEnabled,detail:current.detail,reflections:post.rainReflectionsEnabled,grass:grass.count,grassRadius:grass.radius,rain:atmosphere?.root.userData.rain||{...rain.counts,radius:rain.radius},calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};
};
function pixels(){const c=document.createElement('canvas');c.width=renderer.domElement.width;c.height=renderer.domElement.height;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(renderer.domElement,0,0);return ctx.getImageData(0,0,c.width,c.height).data;}
window.compare=()=>{
 window.draw({rain:false,reflections:false});const a=pixels();window.draw({reflections:true});const b=pixels();
 let changed=0,top=0,color=0,solidRows=0;
 for(let y=450;y<550;y++){const i=(y*1200+600)*4;if(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])>3)solidRows++;}for(let i=0;i<a.length;i+=4){const d=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);if(d>3){changed++;if(i/4/1200<340)top++;if(b[i]>b[i+1]*1.2||b[i+2]>b[i]*1.2)color++;}}
 window.draw({reflections:false});const c=pixels();return {changed,top,color,solidRows,restored:a.every((v,i)=>v===c[i])};
};
window.benchmark=async()=>{
 const results=[];
 for(const [detail,reflections]of[['low',false],['high',false],['ultra',false],['ultra',true]]){
  for(let i=0;i<16;i++)window.draw({detail,reflections,rain:true},1/60);renderer.getContext().finish();const samples=[];let state;
  for(let i=0;i<30;i++){await new Promise(requestAnimationFrame);const start=performance.now();state=window.draw({},1/60);renderer.getContext().finish();samples.push(performance.now()-start);}
  samples.sort((a,b)=>a-b);results.push({...state,medianMs:samples[15],p95Ms:samples[28]});
 }
 return results;
};
window.impact=(x=-10,z=24)=>{world.scene.getObjectByName('marina-bay-water').material.userData.ripple(x,z,1);return window.advance(18);};
window.advance=(frames=90)=>{for(let i=0;i<frames;i++)window.draw({},1/60);return window.draw();};
window.benchmarkWater=async()=>{
 const result=[];
 for(const water of [false,true]){
  for(let i=0;i<8;i++)window.draw({water,detail:'ultra'},1/60);const samples=[];let state;
  for(let i=0;i<20;i++){await new Promise(requestAnimationFrame);const start=performance.now();state=window.draw({},1/60);renderer.getContext().finish();samples.push(performance.now()-start);}
  samples.sort((a,b)=>a-b);result.push({water,...state,medianMs:samples[10],p95Ms:samples[18]});
 }
 return result;
};
window.compareWater=()=>{
 window.draw({water:false});const before=pixels();const state=window.draw({water:true});const after=pixels();
 let changed=0,upper=0;for(let i=0;i<before.length;i+=4){const delta=Math.abs(before[i]-after[i])+Math.abs(before[i+1]-after[i+1])+Math.abs(before[i+2]-after[i+2]);if(delta>5){changed++;if(i/4/1200<300)upper++;}}
 window.draw({water:false});const restored=pixels().every((v,i)=>v===before[i]);
 return {changed,upper,restored,enabled:state.waterReflections};
};
window.movementCost=()=>{
 const initial=camera.position.clone(),times=[];window.draw({detail:'ultra',reflections:true});
 for(let i=0;i<12;i++){camera.position.x+=4;const start=performance.now();window.draw({},1/60);renderer.getContext().finish();times.push(performance.now()-start);}
 camera.position.copy(initial);window.draw();times.sort((a,b)=>a-b);return {medianMs:times[6],worstMs:times[11]};
};
window.move=(x,y,z,targetX=0,targetY=.5,targetZ=-20)=>{camera.position.set(x,y,z);camera.lookAt(targetX,targetY,targetZ);return window.draw();};
window.resize=(width,height)=>{renderer.setSize(width,height);camera.aspect=width/height;camera.updateProjectionMatrix();post.setSize();return window.draw();};
for(let i=0;i<100;i++)window.draw({},1/30);window.ready=true;
</script></body></html>
