<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battlefield scale regression</title>
<style>html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:#18232a;color:white;font:14px system-ui}#info{position:absolute;top:15px;left:15px;background:#16232ce8;padding:14px;max-width:440px;border-radius:8px}button{padding:10px;margin-top:8px}canvas{display:block}</style></head>
<body><div id="stage"></div><div id="info"><strong>Battlefield scale verification</strong><p id="state">Loading</p><button id="start">Enter district</button></div><script type="module">
import {createFpsEngine} from '/src/game/fps-engine.ts';
import {createProfile,resolveLoadout} from '/src/game/armory-state.ts';
import {createExpeditionLoot} from '/src/game/expedition-loot.ts';
let engine,hud,frames=[],recording=false,last;
function frame(now){if(recording&&last)frames.push(now-last);last=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.loadTrial=async(id,size)=>{
 engine?.dispose();document.querySelector('#stage').replaceChildren();hud=undefined;
 const profile=createProfile();
 engine=createFpsEngine(document.querySelector('#stage'),next=>{
  hud=next;window.hud=next;
  document.querySelector('#state').textContent=`${id} · ${size} troops · ${next.phase} · ${next.arena?.facilities?.sites.length??0} objectives · ${next.arena?.actors.filter(a=>a.bot&&a.squad&&a.alive).length??0} alive`;
 },{loadout:resolveLoadout(profile),expedition:{zone:id,battlefieldSize:size,profile,loot:createExpeditionLoot('battlefield-browser'),autoRespawn:true,onTravel(){},onEquipment(){},onVendorPurchase(){throw Error('Purchases are not part of this smoke');}}});
 window.engine=engine;document.querySelector('#start').onclick=()=>{engine.chooseDeployment('entry');engine.start();};
 const start=performance.now();while(hud?.phase!=='ready'){if(hud?.phase==='error'||performance.now()-start>60000)throw Error('Engine failed to load');await new Promise(r=>setTimeout(r,100));}
 return {bots:hud.arena.actors.filter(a=>a.bot&&a.squad).length,friendlies:hud.arena.actors.filter(a=>a.bot&&a.squad&&a.faction==='armed-forces').length,sites:hud.arena.facilities.sites.map(s=>({id:s.id,name:s.name,kind:s.kind}))};
};
window.measureTrial=async(seconds)=>{
 engine.skipDeployment();await new Promise(r=>setTimeout(r,2000));frames=[];last=undefined;recording=true;
 await new Promise(r=>setTimeout(r,seconds*1000));recording=false;
 const sorted=[...frames].sort((a,b)=>a-b),actors=hud.arena.actors.filter(a=>a.bot&&a.squad);
 const gl=document.querySelector('canvas').getContext('webgl2'),debug=gl?.getExtension('WEBGL_debug_renderer_info');
 return {phase:hud.phase,renderer:debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):'unavailable',viewport:[innerWidth,innerHeight],frames:frames.length,averageFps:1000/(frames.reduce((a,b)=>a+b,0)/frames.length),frameMs:{p50:sorted[Math.floor(sorted.length*.5)],p95:sorted[Math.floor(sorted.length*.95)]},alive:actors.filter(a=>a.alive).length,objectives:[...new Set(actors.map(a=>a.objective).filter(Boolean))],sites:hud.arena.facilities.sites.length};
};
window.ready=true;
</script></body></html>
