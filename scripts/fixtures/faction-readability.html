<!doctype html><html><head><meta charset="utf-8"><title>Faction silhouette review</title><style>
body{margin:0;background:#aeb9ba;color:#172124;font:14px system-ui}canvas{display:block}header{z-index:1;position:absolute;top:12px;left:18px}small{display:block;margin-top:4px}.labels{z-index:1;position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}.labels span{align-self:end;padding:14px}body.gray canvas{filter:grayscale(1)}
</style></head><body><header>Faction and role recognition<small>?gray=1 · ?yaw=3.14 (rear) · ?rank=1|2|3 · ?distance=12 · ?pose=run|crouch|prone · ?labels=0</small></header><div class="labels" id="labels"></div><script type="module">
import * as THREE from 'three';
import { createCharacterRig } from '/src/game/character-rig.ts';
import { arenaCharacterLook } from '/src/game/character-looks.ts';
const params=new URLSearchParams(location.search),yaw=Number(params.get('yaw')??.35),rank=Number(params.get('rank')??2),distance=Number(params.get('distance')??4.5),pose=params.get('pose');
if(params.has('gray'))document.body.classList.add('gray');
const roles=['assault','tank','sniper','mortar-crew'],figures=['armed-forces','mercenaries'].flatMap(faction=>roles.map(role=>({bot:true,faction,role,rank,id:'same-soldier'})));
if(params.get('labels')==='0')document.querySelector('header').hidden=true;
document.getElementById('labels').innerHTML=params.get('labels')==='0'?'':figures.map(actor=>`<span>${actor.faction==='armed-forces'?'ARMED FORCES':'BLACK KITE'} · ${actor.role.toUpperCase()} · R${rank}</span>`).join('');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.setClearColor('#aeb9ba');renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const views=figures.map(actor=>{
 const scene=new THREE.Scene(),look=arenaCharacterLook(actor),rig=createCharacterRig(look,actor.faction+actor.role);scene.add(rig.root);
 scene.add(new THREE.HemisphereLight('#edf3ff','#54564c',2.4));const sun=new THREE.DirectionalLight('#fff0d9',3);sun.position.set(-2,4,-3);scene.add(sun);
 for(let t=0;t<1.3;t+=1/60)rig.update(1/60,{aim:.4,...(pose==='run'?{velocity:{x:0,z:-4}}:pose==='crouch'?{crouch:1}:pose==='prone'?{prone:true}:{})});
 const camera=new THREE.PerspectiveCamera(30,innerWidth/4/(innerHeight/2),.05,80);camera.position.set(-Math.sin(yaw)*distance,1.25,-Math.cos(yaw)*distance);camera.lookAt(0,.95,0);camera.updateMatrixWorld(true);
 rig.root.updateMatrixWorld(true);let finite=true;rig.root.traverse(o=>{if(!o.matrixWorld.elements.every(Number.isFinite))finite=false;});
 return {scene,camera,rig,actor,look,finite};
});
renderer.setScissorTest(true);const results=[];
views.forEach(({scene,camera,actor,look,finite},i)=>{const w=innerWidth/4,h=innerHeight/2,x=i%4*w,y=(1-Math.floor(i/4))*h;renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);renderer.render(scene,camera);results.push({faction:actor.faction,role:actor.role,rank,uniform:look.uniform,roleKit:look.roleKit,draws:renderer.info.render.calls,triangles:renderer.info.render.triangles,finite});});
window.results=results;window.ready=true;
</script></body></html>
