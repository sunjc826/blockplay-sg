<!doctype html><meta charset="utf-8"><title>Movement and throw regression</title>
<style>html,body,#game{margin:0;width:100%;height:100%;overflow:hidden}canvas{display:block}</style><div id="game"></div>
<script type="module">
import { createFpsEngine } from '/src/game/fps-engine.ts';
import { createProfile, resolveLoadout } from '/src/game/armory-state.ts';
// Throttle real render callbacks so this exercises the engine's elapsed-time path.
const rate=Number(new URLSearchParams(location.search).get('fps')||60), raf=window.requestAnimationFrame.bind(window);
window.requestAnimationFrame=callback=>{const due=performance.now()+1000/rate-2;const tick=now=>now>=due?callback(now):raf(tick);return raf(tick);};
const profile=createProfile();profile.consumables={'grenade-smoke':4};
window.engine=createFpsEngine(document.querySelector('#game'),hud=>window.hud=hud,{tutorial:true,loadout:resolveLoadout(profile)});
</script>
