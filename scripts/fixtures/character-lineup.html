<!doctype html><html><head><meta charset="utf-8"><title>Character line-up</title><style>
body{margin:0;background:#aeb9ba;color:#172124;font:14px system-ui}canvas{display:block}header{z-index:1;position:absolute;top:10px;left:16px}small{display:block;margin-top:4px}
.labels{z-index:1;position:absolute;inset:0;pointer-events:none;display:grid}.labels span{align-self:end;padding:10px;font-size:12px}
body.night{color:#c9d3d6}
</style></head><body>
<!--
  Review page for character heads, bodies and faction looks. No health bars or name tags are drawn here.
  ?set=factions (default: the four factions, rifleman / heavy / marksman each) | faces (heads of soldiers and locals) | squad (one faction per row at ranks 1-3)
  ?view=head|body (camera framing)   ?yaw=radians (0 front, 1.57 side, 3.14 rear)   ?distance=metres
  ?light=day|night|rain              ?filter=gray|deutan|protan|tritan (colour-vision simulation)
  ?pose=run|crouch|prone             ?labels=0
  window.results lists draws and triangles per figure, as drawn by a skinned arena figure.
-->
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="deutan"><feColorMatrix type="matrix" values=".367 .861 -.228 0 0  .28 .673 .047 0 0  -.012 .043 .969 0 0  0 0 0 1 0"/></filter>
<filter id="protan"><feColorMatrix type="matrix" values=".152 1.053 -.205 0 0  .115 .786 .099 0 0  -.004 -.048 1.052 0 0  0 0 0 1 0"/></filter>
<filter id="tritan"><feColorMatrix type="matrix" values="1.256 -.077 -.179 0 0  -.078 .931 .148 0 0  .005 .691 .304 0 0  0 0 0 1 0"/></filter>
</defs></svg>
<header id="header">Character line-up<small id="note"></small></header><div class="labels" id="labels"></div><script type="module">
import * as THREE from 'three';
import { createCharacterRig } from '/src/game/character-rig.ts';
import { arenaCharacterLook, npcCharacterLook } from '/src/game/character-looks.ts';
const params=new URLSearchParams(location.search),set=params.get('set')??'factions',view=params.get('view')??(set==='faces'?'head':'body');
const yaw=Number(params.get('yaw')??.45),distance=Number(params.get('distance')??(view==='head'?.95:4.6)),pose=params.get('pose'),light=params.get('light')??'day',filter=params.get('filter');
const soldier=(faction,role,rank,id)=>({label:`${faction} · ${role} · R${rank}`,look:arenaCharacterLook({bot:true,faction,role,rank,id:id??`${faction}-${role}`})});
const local=(id,role,kind)=>({label:`local · ${role}`,look:npcCharacterLook({id,role,interaction:{kind}})});
const FACTIONS=['armed-forces','mercenaries','freedom-force','collective-cops'];
const sets={
  factions:{cols:4,figures:['assault','tank','sniper'].flatMap(role=>FACTIONS.map(f=>soldier(f,role,2)))},
  squad:{cols:6,figures:['armed-forces','mercenaries'].flatMap(f=>[1,2,3].flatMap(rank=>['assault','mortar-crew'].map(role=>soldier(f,role,rank,`${f}-${rank}`))))},
  faces:{cols:4,figures:[soldier('armed-forces','assault',2,'a'),soldier('armed-forces','sniper',1,'b'),soldier('mercenaries','assault',1,'c'),soldier('mercenaries','tank',3,'d'),
    local('uncle-lim','resident','dialogue'),local('auntie-mei','kopi stall','vendor'),local('siti','hawker','vendor'),local('guide-3','local guide','dialogue')]},
};
const {cols,figures}=sets[set]??sets.factions,rows=Math.ceil(figures.length/cols);
const sky=light==='night'?'#0b1118':light==='rain'?'#69757b':'#aeb9ba';
document.body.style.background=sky;if(light==='night')document.body.classList.add('night');
const labels=document.getElementById('labels');labels.style.gridTemplateColumns=`repeat(${cols},1fr)`;labels.style.gridTemplateRows=`repeat(${rows},1fr)`;
if(params.get('labels')==='0')document.getElementById('header').hidden=true;else{labels.innerHTML=figures.map(f=>`<span>${f.label}</span>`).join('');document.getElementById('note').textContent=location.search||'?set=factions|faces|squad';}
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.setClearColor(sky);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
if(filter)renderer.domElement.style.filter=filter==='gray'?'grayscale(1)':`url(#${filter})`;
const drive={aim:.4,...(pose==='run'?{velocity:{x:0,z:-4}}:pose==='crouch'?{crouch:1}:pose==='prone'?{prone:true}:{})};
const views=figures.map(({look,label})=>{
  const scene=new THREE.Scene(),rig=createCharacterRig(look,label,{skinned:true});scene.add(rig.root);
  if(light==='night'){scene.add(new THREE.HemisphereLight('#3a4a66','#0c0f12',.5));const moon=new THREE.DirectionalLight('#9fb6dd',.55);moon.position.set(2,5,-2);scene.add(moon);scene.fog=new THREE.Fog(sky,6,90);}
  else if(light==='rain'){scene.add(new THREE.HemisphereLight('#aab4ba','#4a4d48',1.5));const sun=new THREE.DirectionalLight('#c9d0d2',.6);sun.position.set(-2,4,-3);scene.add(sun);scene.fog=new THREE.Fog(sky,4,70);}
  else{scene.add(new THREE.HemisphereLight('#edf3ff','#54564c',2.4));const sun=new THREE.DirectionalLight('#fff0d9',3);sun.position.set(-2,4,-3);scene.add(sun);}
  for(let t=0;t<1.3;t+=1/60)rig.update(1/60,drive);
  const aspect=innerWidth/cols/(innerHeight/rows),camera=new THREE.PerspectiveCamera(view==='head'?24:30,aspect,.05,200);
  rig.root.updateMatrixWorld(true);const head=rig.joints.head.getWorldPosition(new THREE.Vector3());
  const focus=view==='head'?head.clone().add(new THREE.Vector3(0,.09,0)):new THREE.Vector3(0,pose==='prone'?.3:.95,0);
  camera.position.set(focus.x-Math.sin(yaw)*distance,focus.y+(view==='head'?.03:.3),focus.z-Math.cos(yaw)*distance);camera.lookAt(focus);camera.updateMatrixWorld(true);
  return {scene,camera,label};
});
renderer.setScissorTest(true);const results=[];
views.forEach(({scene,camera,label},i)=>{const w=innerWidth/cols,h=innerHeight/rows,x=i%cols*w,y=(rows-1-Math.floor(i/cols))*h;renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);renderer.info.reset();renderer.render(scene,camera);results.push({label,draws:renderer.info.render.calls,triangles:renderer.info.render.triangles});});
window.results=results;window.ready=true;
</script></body></html>
