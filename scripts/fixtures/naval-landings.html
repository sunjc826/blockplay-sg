<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentosa landing parties</title><style>body{margin:0;background:#b9d5dd;font:15px system-ui}canvas{display:block}header{position:absolute;left:16px;top:16px;color:white;text-shadow:0 1px 3px #000}small{display:block}</style></head><body><header>Sentosa · naval landing parties<small id="status">Loading</small></header><script type="module">
import * as THREE from 'three';
import { buildDistrictWorld } from '/src/game/district-world.ts';
import { createArena } from '/src/game/arena-rules.ts';
import { createArenaRuntime, validArenaSnapshot } from '/src/game/arena-runtime.ts';
import { createCombatEventVisuals } from '/src/game/combat-event-visuals.ts';
import { createSceneCover } from '/src/game/scene-cover.ts';
import { createVerticalMovement } from '/src/game/vertical-movement.ts';
import { getWalkSurfaces, getTraversalObstacles } from '/src/game/vertical-routes.ts';
import { validatedNavalSites } from '/src/game/naval-route-validation.ts';
import { transportDriverPoint, transportPoint } from '/src/game/combat-transports.ts';
const world=buildDistrictWorld('sentosa'),scene=world.scene;
const traversal={bounds:world.bounds,obstacles:world.obstacles,surfaces:getWalkSurfaces(scene),traversalObstacles:getTraversalObstacles(scene)};
const sites=validatedNavalSites(scene,world.environment.navalSites,world.bounds,createVerticalMovement(traversal));
if(sites.length!==2)throw Error('Both real shoreline lanes must validate');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,1000),cover=createSceneCover(scene);
const cast=(o,d,far)=>{const distance=cover.distance(o,d,far);return distance<far?o.clone().addScaledVector(d,distance):null;};
const visuals=createCombatEventVisuals(scene,cast,{reduced:()=>false});
const gun=[{damage:200,interval:.06,capacity:100,reload:1,ballistics:{velocity:1500,drop:0}}];
let arena,runtime,env,deliver,event,spawn;
const boat=()=>arena.snapshot().transports?.find(t=>t.mode==='sea');
function render(dt=.05,draw=false){const s=arena.snapshot();if(!validArenaSnapshot(s,env))throw Error('Invalid host snapshot at '+s.elapsed);
 deliver('host',{type:'arena-state',snapshot:s,started:true,matchId:event.id});
 const received=runtime.update(dt,{x:0,y:1.75,z:0,yaw:0,pitch:0,weapon:0,playing:false}).snapshot;
 if(received?.tick!==s.tick)throw Error('Guest rejected snapshot');
 visuals.update(dt,s.events??[],s.elapsed,camera,s.raiders??[],s.transports??[]);if(draw)renderer.render(scene,camera);}
function advance(seconds){for(let t=0;t<seconds-1e-8;t+=.05){const dt=Math.min(.05,seconds-t);arena.step(dt);render(dt);}}
function setup(friendly=false){runtime?.dispose();visuals.reset();spawn={x:0,z:-100};
 env={bounds:world.bounds,move:world.move,spawns:[{x:0,z:130},{x:90,z:130}],playerSpawn:spawn,endless:true,reinforcements:true,population:4,navalSites:sites,facilities:{sites:[]},
 ...(friendly?{heat:{defaults:{mercenaries:{min:0,max:0},'armed-forces':{min:1,max:1}},sectors:[]},savedReinforcementClocks:{naval:{mercenaries:150,'armed-forces':0},external:{mercenaries:80,'armed-forces':0}}}: {})};
 arena=createArena(world.obstacles,0,'assault',env,undefined,traversal,cover.distance);
 arena.addPlayer('planner','Planner',0,0,gun,undefined,true);
 if(friendly){arena.step(.05);event=arena.snapshot().events.find(e=>e.kind==='transport-sea');}else event=arena.triggerEvent('transport-sea');
 if(!event)throw Error('No boat launched');
 runtime=createArenaRuntime({scene,obstacles:world.obstacles,environment:env,botCount:0,session:{id:'viewer',name:'Viewer',role:'guest',send(){},subscribe(cb){deliver=cb;return()=>{}},getPeers:()=>[{id:'host',name:'Host'}],onPeers:()=>()=>{},close(){}}});}
function shooter(at){Object.assign(spawn,at);arena.addPlayer('shooter','Bravo',0,0,gun,undefined,true);}
function fire(at){advance(.07);const from=arena.snapshot().actors.find(a=>a.id==='shooter'),ray=new THREE.Vector3(at.x-from.x,at.y-from.y,at.z-from.z).normalize();arena.shoot('shooter',from,ray,0);for(let i=0;i<400&&arena.inFlight('shooter');i++)advance(.002);}
window.reviewNaval=(scenario='unloading',friendly=false)=>{
 setup(friendly);
 if(scenario==='approach')advance(8);
 else if(scenario==='ramping')advance(16);
 else if(scenario==='unloading')advance(17.5);
 else if(scenario==='depart')advance(28);
 else if(scenario==='complete')advance(46);
 else if(scenario==='blocked'){advance(15.1);Object.assign(spawn,sites[0].ramp.to);arena.addPlayer('blocker','Blocker',0,0,gun,undefined,true);advance(15);}
 else if(scenario==='driver'){advance(10);const t=boat();shooter({x:t.x+.65,z:180});fire(transportDriverPoint(t));advance(8);}
 else if(scenario==='destroyed'){advance(15.1);const t=boat();shooter({x:t.x+20,z:194});for(let i=0;i<5;i++)fire(transportPoint(boat(),0,.2,0));advance(3);}
 const t=boat(),site=sites.find(s=>s.id===event.landing),s=arena.snapshot();
 if(scenario==='approach'){camera.position.set(site.entry.x+18,9,site.berth.z+30);camera.lookAt(t.x,t.y+1,t.z);}
 else{camera.position.set(site.berth.x+11,6,site.berth.z-15);camera.lookAt(site.berth.x,1.6,site.berth.z-2);}
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();camera.updateMatrixWorld(true);renderer.setSize(innerWidth,innerHeight);render(.01,true);
 let craft,visibleInfantry=0;scene.traverse(o=>{if(o.name==='Landing craft'&&o.visible)craft=o;if(o.userData.arenaActorId&&o.visible&&!s.actors.find(a=>a.id===o.userData.arenaActorId)?.transport)visibleInfantry++;});
 document.querySelector('#status').textContent=`${friendly?'Friendly':'Hostile'} · ${scenario} · ${t.state} · ${t.passengers} aboard · ${s.actors.filter(a=>a.bot&&!a.transport&&a.alive).length} ashore`;
 return{scenario,friendly,time:s.elapsed,state:t.state,health:t.health,passengers:t.passengers,driverAlive:t.driverAlive,ramp:t.ramp,renderedRamp:craft?.getObjectByName('bow-ramp')?.rotation.x,
  infantry:s.actors.filter(a=>a.bot&&!a.transport&&a.alive).map(a=>({x:a.x,y:a.y,z:a.z,faction:a.faction})),visibleInfantry,craftVisible:!!craft,glError:renderer.getContext().getError(),accepted:true};
};
window.reviewNaval();
</script></body></html>
