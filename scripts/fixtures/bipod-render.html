<!doctype html><html><head><meta charset="utf-8"><title>MG bipod articulation</title><style>
body{margin:0;background:#161e25;color:#d9e4e9;font:16px system-ui}canvas{display:block}header{position:absolute;top:20px;left:30px}header small{display:block;color:#92a4b0;margin-top:6px}.labels{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}.labels span{align-self:end;padding:22px}
</style></head><body><header>MG bipods • folded / deployed<small>Ultimax · FN MAG · CIS 50MG</small></header><div class="labels"><span>ULTIMAX · FOLDED</span><span>FN MAG · FOLDED</span><span>CIS 50MG · FOLDED</span><span>ULTIMAX · DEPLOYED</span><span>FN MAG · DEPLOYED</span><span>CIS 50MG · DEPLOYED</span></div><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
import { buildServiceWeapon } from '/src/game/service-weapon-models.ts';
import { buildWeaponBipod, poseWeaponBipod } from '/src/game/weapon-bipod.ts';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.setClearColor('#161e25');document.body.append(renderer.domElement);
const original=(await new GLTFLoader().loadAsync('/models/field-kit/ultimax-inspired.glb')).scene;
const scenes=[];
for(let row=0;row<2;row++)for(let col=0;col<3;col++){
 const id=['ultimax-inspired','mag-inspired','cis50-inspired'][col];
 const model=col===0?original.clone(true):buildServiceWeapon(id);
 if(col===0)model.add(buildWeaponBipod(id));poseWeaponBipod(model,id,row);
 const scene=new THREE.Scene();scene.add(model,new THREE.HemisphereLight('#daeafa','#384148',3));
 const light=new THREE.DirectionalLight('#fff0d9',4);light.position.set(-1,2,2);scene.add(light);
 const rim=new THREE.DirectionalLight('#99bce8',3);rim.position.set(2,1,-2);scene.add(rim);
 const camera=new THREE.PerspectiveCamera(36,innerWidth/3/(innerHeight/2),.01,10);
 camera.position.set(1.3,.65,1.0);camera.lookAt(0,.02,-.18);scenes.push({scene,camera});
}
renderer.setScissorTest(true);
scenes.forEach(({scene,camera},i)=>{const w=innerWidth/3,h=innerHeight/2,x=i%3*w,y=(1-Math.floor(i/3))*h;renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);renderer.render(scene,camera)});
window.ready=true;
</script></body></html>
