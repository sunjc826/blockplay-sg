<!doctype html>
<!-- Deterministic NVG review: ?device=nvg-gen1 (also gen2/gen3), &chart for pixel checks.
     window.visionReview.draw(id, { noise: 0, distortion: 0 }) compares optics without reloading. -->
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Night vision lens review</title></head>
<body style="margin:0;background:#000;overflow:hidden"><script type="module">
import * as THREE from 'three';
import { createVisionSystem } from '/src/game/fps-vision.ts';
import { createVisionState, VISION_DEVICES } from '/src/game/vision-devices.ts';
import { dayLighting } from '/src/game/world-lighting.ts';
import { setEnvironmentSettings } from '/src/game/environment-settings.ts';
const params = new URLSearchParams(location.search), chart = params.has('chart');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); renderer.autoClear = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.append(renderer.domElement);
let world, camera, atmosphere, lights, region, createAtmosphere, exposureBakeMs = 0;
if (chart) {
  world = { scene: new THREE.Scene() };
  camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  world.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
    fragmentShader: `varying vec2 vUv;void main(){
      vec2 grid=step(vec2(0.14),fract(vUv*vec2(32.,24.)));
      float value=0.16+0.34*grid.x*grid.y;
      gl_FragColor=vec4(vec3(value),1.);
    }`,
  })));
} else {
  setEnvironmentSettings({ weather:params.get('weather') || 'sunny', celebration:'none', timeOfDay:params.get('time') || 'night', reducedEffects:false, shadows:false });
  const { getRegion } = await import('/src/game/regions.ts');
  ({ createWorldAtmosphere: createAtmosphere } = await import('/src/game/world-atmosphere.ts'));
  const { createNightLights } = await import('/src/game/world-night-lights.ts');
  const { separateInstancedMaterials } = await import('/src/game/instanced-materials.ts');
  region = getRegion(params.get('region') || 'marina-bay'); world = region.build();
  if (params.has('yard')) {
    world.dispose();
    const scene = new THREE.Scene(); scene.background = new THREE.Color('#b9dcea');
    scene.add(new THREE.HemisphereLight('#e4efff', '#707060', 1.8));
    const sun = new THREE.DirectionalLight('#fff3e2', 2); sun.position.set(20, 40, 30); scene.add(sun);
    const material = new THREE.MeshStandardMaterial({ color:'#888888', roughness:1 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), material); floor.rotation.x = -Math.PI / 2; floor.name='review-floor'; scene.add(floor);
    for (const [x,z] of [[-12,-6],[2,-10],[12,-6]]) {
      const box = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), material); box.position.set(x,1.5,z); scene.add(box);
    }
    if (params.has('shelter')) {
      const roof = new THREE.Mesh(new THREE.BoxGeometry(16, .35, 20), material); roof.position.set(-18,4,-14); scene.add(roof);
      for (const x of [10, 26]) {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 9, 30), material); wall.position.set(x,4.5,-14); scene.add(wall);
      }
    }
    if (params.has('people')) {
      const { createCharacterRig } = await import('/src/game/character-rig.ts');
      const { arenaCharacterLook } = await import('/src/game/character-looks.ts');
      for (const [id,x,z] of [['moonlit',4,-12],['covered',-18,-14]]) {
        const rig = createCharacterRig(arenaCharacterLook({bot:true,role:'assault',id,rank:2}),id);
        rig.root.position.set(x,0,z); rig.root.rotation.y=Math.PI;rig.update(1/60,{aim:.15});scene.add(rig.root);
      }
    }
    world = { scene, obstacles:[], animate(){} };
    region = { stamps:[], mapRoads:[{ points:[{x:-90,z:0},{x:90,z:0}] }], roadWidth:14, bounds:{minX:-100,maxX:100,minZ:-100,maxZ:100} };
  }
  separateInstancedMaterials(world.scene);
  const bakeStart = performance.now();
  atmosphere = createAtmosphere(world.scene, region.stamps, world.obstacles, false, renderer);
  exposureBakeMs = performance.now() - bakeStart;
  lights = createNightLights(world.scene, { roads:region.mapRoads, roadWidth:region.roadWidth, bounds:region.bounds, obstacles:world.obstacles });
  camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, .08, 800);
  const vector = (key, fallback) => params.has(key) ? params.get(key).split(',').map(Number) : fallback;
  camera.position.set(...vector('cam', params.has('yard') ? [0,14,36] : [0,2,18]));
  camera.lookAt(...vector('look', params.has('yard') ? [0,0,-4] : [0,7,-100])); camera.updateMatrixWorld(true);
}
const system = createVisionSystem(renderer, { world:world.scene, view:new THREE.Scene() });
function draw(id = params.get('device') || 'nvg-gen1', overrides = {}, state = createVisionState(true)) {
  const spec = VISION_DEVICES[id] ? { ...VISION_DEVICES[id], ...overrides } : undefined;
  atmosphere?.update(1 / 30, camera);
  const lighting = atmosphere?.light.lighting ?? dayLighting(22.5);
  lights?.update(lighting, params.has('shelter') ? 1 : 0, 1 / 30, camera, renderer);
  renderer.toneMappingExposure = system.begin(spec, state, { dt:1 / 30, lighting, blackout:0, exposure:lighting.exposure });
  world.animate?.(0); renderer.clear(); renderer.render(world.scene, camera); system.end(spec, state, 1);
}
function pixels() {
  const copy = document.createElement('canvas'); copy.width = innerWidth; copy.height = innerHeight;
  const context = copy.getContext('2d'); context.drawImage(renderer.domElement, 0, 0);
  return context.getImageData(0, 0, copy.width, copy.height);
}
function conditions(patch) {
  setEnvironmentSettings(patch); atmosphere.dispose();
  atmosphere = createAtmosphere(world.scene, region.stamps, world.obstacles, false, renderer);
  draw('none');
}
window.visionReview = { draw, pixels, conditions, renderer, camera, world, lights, exposureBakeMs, get atmosphere(){return atmosphere}, ready:true };
draw();
</script></body></html>
