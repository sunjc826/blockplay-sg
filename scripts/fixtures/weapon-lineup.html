<!doctype html><html><head><meta charset="utf-8"><title>Weapon line-up</title><style>
body{margin:0;background:#8a959b;color:#10161a;font:13px system-ui}canvas{display:block}.labels{position:absolute;top:0;left:0;width:100vw;height:75vw;pointer-events:none;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr)}.labels span{align-self:start;padding:8px 12px;font-weight:600}.labels em{display:block;font-style:normal;font-weight:400}
</style></head><body><div class="labels" id="labels"></div><script type="module">
// Every playable platform, dressed as issued, for model review.
// ?page=N (four platforms a page) · ?only=<index> for one platform at six angles, &view=0..7 for one of them large · ?flat=1 for a grey clay pass · ?surface=1 for the first-person surface detail.
import * as THREE from '/node_modules/three/build/three.module.js';
import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
import { buildServiceWeapon } from '/src/game/service-weapon-models.ts';
import { dressWeapon, dressCarriedWeapon } from '/src/game/armory-visuals.ts';
import { createProfile, resolveLoadout } from '/src/game/armory-state.ts';
import { FPS_WEAPONS } from '/src/game/fps-rules.ts';
const query = new URLSearchParams(location.search), only = query.get('only'), page = Number(query.get('page') ?? 0), flat = query.has('flat'), surface = query.has('surface');
const loadout = resolveLoadout(createProfile()), loader = new GLTFLoader();
const indices = only !== null ? [Number(only)] : FPS_WEAPONS.map((_, i) => i).slice(page * 4, page * 4 + 4);
const single = query.get('view'), all = [[0, .12], [Math.PI, .12], [-.75, .3], [-2.35, .3], [-Math.PI / 2, .1], [0, 1.45], [2.2, .25], [1.57, .12]];
const views = single !== null ? [all[Number(single)]] : only !== null ? all.slice(0, 6) : [[0, .12], [-.8, .3]];
const cols = single !== null ? 1 : 2, rows = single !== null ? 1 : only !== null ? 3 : indices.length;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); const W = Number(query.get('w') ?? 1600), H = Number(query.get('h') ?? 1200); renderer.setSize(W, H, false); renderer.setPixelRatio(1); renderer.domElement.style.cssText = 'width:100vw;height:75vw';
renderer.setClearColor('#8a959b'); renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.append(renderer.domElement);
const w = W / cols, h = H / rows, cells = [], stats = [];
const clay = new THREE.MeshStandardMaterial({ color: '#b9bbb8', roughness: .7 });
for (const index of indices) {
  const spec = FPS_WEAPONS[index];
  const model = index < 2 ? (await loader.loadAsync(`/models/field-kit/${spec.id}.glb`)).scene : buildServiceWeapon(spec.id);
  if (!model) continue;
  if (loadout.weapons[index]) (surface ? dressCarriedWeapon : dressWeapon)(model, loadout.weapons[index]);
  let meshes = 0, triangles = 0; const materials = new Set(), geometries = new Set();
  model.traverse(o => { if (o.isMesh && o.visible) { meshes++; geometries.add(o.geometry); (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => materials.add(m)); triangles += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; if (flat) o.material = clay; } });
  const scene = new THREE.Scene(); scene.add(model, new THREE.HemisphereLight('#e8f2ff', '#5b6150', 2.2));
  const key = new THREE.DirectionalLight('#fff3e0', 3); key.position.set(2, 3, 1.5); scene.add(key);
  const rim = new THREE.DirectionalLight('#a9c4e8', 1.6); rim.position.set(-2, 1, -2); scene.add(rim);
  const bounds = new THREE.Box3().setFromObject(model), centre = bounds.getCenter(new THREE.Vector3()), size = bounds.getSize(new THREE.Vector3());
  const stat = { index, id: spec.id, name: spec.name, meshes, triangles: Math.round(triangles), materials: materials.size, geometries: geometries.size, length: +size.z.toFixed(3), height: +size.y.toFixed(3), width: +size.x.toFixed(3) };
  stats.push(stat);
  for (const [yaw, pitch] of views) {
    const camera = new THREE.PerspectiveCamera(24, w / h, .01, 20), far = Math.max(size.z, size.y * 1.6) * 1.25 / (2 * Math.tan(12 * Math.PI / 180)) / Math.min(1, w / h / 1.2) * (single !== null ? .42 : only !== null ? .62 : .5) + .2;
    camera.position.set(centre.x + Math.cos(yaw) * Math.cos(pitch) * far, centre.y + Math.sin(pitch) * far, centre.z + Math.sin(yaw) * Math.cos(pitch) * far); camera.lookAt(centre);
    cells.push({ scene, camera });
    document.getElementById('labels').insertAdjacentHTML('beforeend', `<span>${index} · ${spec.name}<em>${meshes} meshes · ${stat.triangles} tris · ${materials.size} mats · ${stat.length} m</em></span>`);
  }
}
document.body.style.setProperty('--cols', cols); document.body.style.setProperty('--rows', rows);
renderer.setScissorTest(true);
const draw = () => { cells.forEach(({ scene, camera }, i) => { const x = (i % cols) * w, y = (rows - 1 - Math.floor(i / cols)) * h; renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h); renderer.render(scene, camera); }); requestAnimationFrame(draw); };
draw(); window.stats = stats; window.ready = true;
</script></body></html>
