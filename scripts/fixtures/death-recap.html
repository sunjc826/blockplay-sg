<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Death recap verification</title>
<style>html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden}#world,#overlay{position:absolute;inset:0}#overlay{pointer-events:none}#overlay button,#overlay input,#overlay label{pointer-events:auto}#start{position:absolute;bottom:15px;right:15px;z-index:25;padding:12px}</style></head>
<body><div id="stage" class="fps-game expedition-game"><div id="world"></div><div id="overlay"></div><button id="start">Enter / Resume</button></div><script type="module">
// The real engine and panels in an expedition: a lethal strike on a nearly dead
// player takes the same path as any other death.
import React from 'react';import {createRoot} from 'react-dom/client';
import '/src/styles.css';import '/src/components/expedition.css';
import {createFpsEngine} from '/src/game/fps-engine.ts';
import {createProfile} from '/src/game/armory-state.ts';
import {createExpeditionLoot} from '/src/game/expedition-loot.ts';
import ExpeditionRespawn from '/src/components/ExpeditionRespawn.tsx';
import DeathRecap from '/src/components/DeathRecap.tsx';
import {DeploymentOverlay} from '/src/components/DeploymentBriefing.tsx';
const root=createRoot(document.querySelector('#overlay')),button=document.querySelector('#start');
const el=React.createElement;
window.engine=createFpsEngine(document.querySelector('#world'),hud=>{
 window.hud=hud;button.hidden=hud.phase==='playing';
 const dead=hud.phase==='playing'&&hud.arenaSelf?.alive===false;
 root.render(dead&&hud.deathRecap?el(DeathRecap,{recap:hud.deathRecap,respawnIn:hud.arenaSelf.respawnIn,onSkip:()=>engine.skipDeathScene(),onMenu:()=>engine.pause()})
  :dead&&hud.respawn?el(ExpeditionRespawn,{view:hud.respawn,seconds:hud.arenaSelf.respawnIn,onChoose:id=>engine.chooseRespawn(id),onAutomatic:value=>engine.setAutoRespawn(value),onMenu:()=>engine.pause()})
  :hud.deploymentBriefing?el(DeploymentOverlay,{location:'Queenstown',intro:hud.deploymentIntro,briefing:hud.deploymentBriefing,clock:()=>engine.deploymentBriefingTime()}):null);
},{region:'queenstown',expedition:{zone:'queenstown',infrastructure:new Map(),checkpoint:{health:4,armor:0,weapon:0,ammunition:[]},profile:createProfile(),loot:createExpeditionLoot('death-recap-review'),
 onTravel(){},onEquipment(){},onVendorPurchase(){return{ok:false,message:'Fixture'};}}});
button.onclick=()=>{engine.configureDebug({combatEvents:true,regeneration:false});engine.start();};
</script></body></html>
