<!doctype html>
<html><body style="margin:0"><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { createFpsEffects } from '/src/game/fps-effects.ts';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1200, 800); document.body.append(renderer.domElement);
const world = new THREE.Scene(), view = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1.5, .1, 100);
camera.position.set(0, 2.2, 5); camera.lookAt(0, 1.4, -9); camera.updateMatrixWorld(true);
let reduced = false;
const effects = createFpsEffects(world, view, { worldLight: false, reduced: () => reduced });
const wake = effects.root.getObjectByName('fps-shot-smoke');
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), new THREE.MeshBasicMaterial({ color: '#5c686a' }));
wall.position.set(0, 2, -3); wall.visible = false; world.add(wall);
const grid = new THREE.GridHelper(60, 60, '#596866', '#84908b'); world.add(grid);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshBasicMaterial({ color: '#87948b' }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -.01; world.add(ground);
const read = () => { const gl = renderer.getContext(); const pixels = new Uint8Array(1200 * 800 * 4); gl.readPixels(0, 0, 1200, 800, gl.RGBA, gl.UNSIGNED_BYTE, pixels); return pixels; };
window.show = (mode = 'day', age = .06) => {
  reduced = mode === 'reduced'; effects.reset(); wall.visible = mode === 'occluded';
  world.background = new THREE.Color(mode === 'night' ? '#17252c' : '#c2d4df');
  for (let n = 0; n < 4; n++) {
    effects.smokeTrail(new THREE.Vector3(-7, 1.4 + n * .018, -9), new THREE.Vector3(8, 1.42, -12), 15.3);
    effects.update(.055, camera);
  }
  effects.update(age, camera);
  wake.visible = false; renderer.render(world, camera); const before = read();
  wake.visible = true; renderer.render(world, camera); const after = read();
  let changed = 0, maximum = 0, total = 0;
  for (let i = 0; i < after.length; i += 4) {
    const delta = Math.max(...[0, 1, 2].map(k => Math.abs(after[i + k] - before[i + k])));
    if (delta) changed++; maximum = Math.max(maximum, delta); total += delta;
  }
  return { changed, maximum, total, count: wake.count, calls: renderer.info.render.calls };
};
window.show(); window.ready = true;
</script></body></html>
