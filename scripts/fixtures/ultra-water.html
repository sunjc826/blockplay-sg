<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Ultra water review</title></head><body style="margin:0"><script type="module">
import * as THREE from 'three';

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,800);renderer.autoClear=false;renderer.info.autoReset=false;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(60,1.5,.08,1000),params=new URLSearchParams(location.search);
const real=params.has('marina');let scene,world,atmosphere,night;
setEnvironmentSettings({timeOfDay:params.get('time')||'noon',weather:params.get('weather')||'sunny',celebration:'none',reducedEffects:false});
setGraphicsSettings({waterDetail:'ultra',rainDetail:'low',grassDetail:'low',waterReflections:true,smaa:false,godRays:'off'});
if(real){
 world=buildMarinaScene();scene=world.scene;world.stamps.forEach(o=>o.visible=false);
 camera.position.set(-30,2,29);camera.lookAt(0,0,-24);
 const region=getRegion('marina-bay');
 atmosphere=createWorldAtmosphere(scene,region.stamps,world.obstacles,false,renderer);
 night=createNightLights(scene,{roads:region.mapRoads,roadWidth:region.roadWidth,bounds:region.bounds,obstacles:world.obstacles});
 for(let i=0;i<60;i++){atmosphere.update(.1,camera);night.update(atmosphere.light.lighting,0,.1,camera,renderer);}
 renderer.toneMappingExposure=atmosphere.light.lighting.exposure;

 scene=new THREE.Scene();scene.background=new THREE.Color('#91b3cd');scene.add(new THREE.HemisphereLight('#ffffff','#637467',2));
 const water=createWaterMaterial({deep:'#1d4750',shallow:'#3d7c84',sky:'#8db6d4',horizon:'#557788',sun:new THREE.Vector3(.5,1,.2),clarity:.55,choppiness:.9});
 const bay=new THREE.Mesh(new THREE.PlaneGeometry(30,30,60,60),water);bay.name='marina-bay-water';bay.rotation.x=-Math.PI/2;bay.renderOrder=1;scene.add(bay);
 const bed=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshBasicMaterial({color:'#a1a490'}));bed.rotation.x=-Math.PI/2;bed.position.y=-2;scene.add(bed);
 for(let x=-12;x<12;x+=2)for(let z=-12;z<12;z+=2){const tile=new THREE.Mesh(new THREE.BoxGeometry(1,.1,1),new THREE.MeshBasicMaterial({color:(x+z)%4===0?'#c8b68d':'#51616b'}));tile.position.set(x,-1.94,z);scene.add(tile);}
 const ledge=new THREE.Mesh(new THREE.BoxGeometry(5,.2,7),new THREE.MeshBasicMaterial({color:'#c8b68d'}));ledge.position.set(-6,-.45,1);scene.add(ledge);
 const post=new THREE.Mesh(new THREE.BoxGeometry(.8,5,.8),new THREE.MeshBasicMaterial({color:'#ed5832'}));post.position.set(1,.5,0);scene.add(post);
 const foreground=new THREE.Mesh(new THREE.BoxGeometry(1.4,1,1),new THREE.MeshBasicMaterial({color:'#ed5832'}));foreground.position.set(0,1,6);scene.add(foreground);
 camera.position.set(0,5,11);camera.lookAt(0,-.4,0);
 if(params.has('shallow')){
  for(let i=0;i<6;i++){
   const step=new THREE.Mesh(new THREE.BoxGeometry(4,.25,.85),new THREE.MeshBasicMaterial({color:'#9d998d'}));
   step.position.set(0,.1-i*.19-.125,3.5-i*.85);scene.add(step);
  }
  const quay=new THREE.Mesh(new THREE.BoxGeometry(2,2.2,12),new THREE.MeshBasicMaterial({color:'#8d8a80'}));
  quay.position.set(6,-.9,0);scene.add(quay);camera.position.set(3,4.2,8);camera.lookAt(0,-.2,1);
 }
}
const bay=scene.getObjectByName('marina-bay-water'),water=bay.material,post=createWorldOcclusion(renderer,scene,camera);
let fleet;
window.boats=()=>{
 if(!fleet)fleet=createFpsVehicles(scene,world?.obstacles??[],{car:'',helicopter:''},{spawns:{car:{x:100,z:100,yaw:0},helicopter:{x:110,z:100,yaw:0},...DRAGON_BOAT_SPAWNS}});
 fleet.omit(['car','helicopter']);return scene.userData.waterBoats;
};
window.boatPose=(x,z,yaw=0,speed=4,index=0,active=true)=>{
 window.boats();const v=fleet.states[index?'dragon-boat-gold':'dragon-boat-red'];
 Object.assign(v,{x,z,yaw,speed,health:300,despawned:!active,y:real?MARINA_WATER.surface:0});fleet.animateEffects(0);
 return scene.userData.waterBoats;
};
window.boatState=()=>({sources:scene.userData.waterBoats,opacity:fleet?.models['dragon-boat-red'].getObjectByName('dragon-wake').material.opacity});
let current={detail:'ultra',reflections:true,ao:false,bloom:false,reduced:false,time:7,smaa:false,rays:'off'};
function pixels(){const c=document.createElement('canvas');c.width=renderer.domElement.width;c.height=renderer.domElement.height;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(renderer.domElement,0,0);return ctx.getImageData(0,0,c.width,c.height).data;}
window.draw=(options={})=>{
 current={...current,...options};setGraphicsSettings({waterDetail:current.detail,smaa:current.smaa});setEnvironmentSettings({reducedEffects:current.reduced});
 water.userData.setTime(current.time);renderer.info.reset();post.render(current.ao,current.bloom,false,current.reflections,current.rays);
 return {supported:post.supported,refraction:Number(post.waterRefractionEnabled),ultra:water.uniforms.uUltra.value,reflections:post.waterReflectionsEnabled,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures,glError:renderer.getContext().getError()};
};
window.move=(x,y,z,tx=0,ty=0,tz=-24)=>{camera.position.set(x,y,z);camera.lookAt(tx,ty,tz);return window.draw();};
window.resize=(w,h)=>{renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();post.setSize();return window.draw();};
window.density=value=>{renderer.setPixelRatio(value);post.setSize();return window.draw();};
window.compare=()=>{
 window.draw({detail:'high',reflections:false});const a=pixels();window.draw({detail:'ultra'});const b=pixels();
 let changed=0,foregroundChanged=0,foreground=0;
 for(let i=0;i<a.length;i+=4){const d=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);if(d>6)changed++;if(a[i]>200&&a[i+1]<170&&a[i+2]<130){foreground++;if(d>6)foregroundChanged++;}}
 window.draw({detail:'high'});const back=pixels();let restored=0;for(let i=0;i<a.length;i++)if(a[i]!==back[i])restored++;
 return {changed,foreground,foregroundChanged,restored};
};
window.shallowLighting=(hour=13,sunlight=1,rain=0)=>{
 const light=dayLighting(hour),sky=new THREE.Color(light.sky);
 water.userData.setLighting(light,sky,sky,sunlight,1);water.userData.setRain(rain,false);return water.uniforms.uCausticLight.value;
};
window.shallowDiff=(mode='caustics')=>{
 const uniform=water.uniforms[mode==='caustics'?'uCausticLight':'uShallowDetail'],value=uniform.value;
 uniform.value=0;window.draw();const a=pixels();uniform.value=value;const state=window.draw();const b=pixels();
 let changed=0,total=0,max=0,foreground=0,redChanged=0;
 for(let i=0;i<a.length;i+=4){const d=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);if(d>2)changed++;total+=d;max=Math.max(max,d);
  if(a[i]>200&&a[i+1]<170&&a[i+2]<130){foreground++;if(d>2)redChanged++;}}
 const width=renderer.domElement.width,height=renderer.domElement.height;
 const patchChanged=point=>{
  const p=new THREE.Vector3(...point).project(camera);let changed=0;
  for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++){
   const ix=Math.round((p.x+1)*.5*width)+x,iy=Math.round((1-p.y)*.5*height)+y,i=(iy*width+ix)*4;
   if(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])>2)changed++;
  }return changed;
 };
 // Red also appears in reflections and on the submerged post; sample the actual dry faces.
 const foregroundChanged=patchChanged([0,1.5,6])+patchChanged([1,2,.4]),dryChanged=patchChanged([0,.1,3.5]);
 return {changed,mean:total/(a.length/4),max,foreground,redChanged,foregroundChanged,dryChanged,state,light:water.uniforms.uCausticLight.value};
};
window.shallowMotion=()=>{
 const chop=water.uniforms.uChop.value;water.uniforms.uChop.value=0;
 window.draw({time:2});const a=pixels();window.draw({time:3});const b=pixels();let changed=0;
 for(let i=0;i<a.length;i+=4)if(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])>2)changed++;
 water.uniforms.uChop.value=chop;return changed;
};
window.shallowBenchmark=async()=>{
 const results=[];window.draw({detail:'ultra'});
 for(const enabled of [false,true]){
  water.uniforms.uShallowDetail.value=enabled?1:0;const times=[];let state;
  for(let i=0;i<60;i++){await new Promise(requestAnimationFrame);const start=performance.now();state=window.draw({time:current.time+1/60});renderer.getContext().finish();if(i>=20)times.push(performance.now()-start);}
  times.sort((a,b)=>a-b);results.push({enabled,...state,medianMs:times[20],p95Ms:times[37]});
 }return results;
};
window.benchmark=async()=>{
 const result=[];for(const detail of ['high','ultra']){
  for(let i=0;i<8;i++)window.draw({detail,reflections:true});renderer.getContext().finish();
  const times=[];let state;for(let i=0;i<20;i++){await new Promise(requestAnimationFrame);const start=performance.now();state=window.draw();renderer.getContext().finish();times.push(performance.now()-start);}times.sort((a,b)=>a-b);
  result.push({detail,...state,medianMs:times[10],p95Ms:times[18]});
 }return result;
};
window.dispose=()=>{post.dispose();fleet?.dispose();atmosphere?.dispose();night?.dispose();world?.dispose();renderer.dispose();};
window.waveReset=()=>{window.draw({detail:'high'});setWaterSwimmer(scene,0,0,false);return window.draw({detail:'ultra',time:0});};
window.waveImpact=(x=0,z=0,strength=1)=>water.userData.ripple(x,z,strength);
window.waveCalibre=(family,x=0,z=0,energy=1)=>{
 const spec=FPS_WEAPONS[family],strength=waterImpactStrength(impactProfile(spec.caliberMm,spec.damage),energy);
 window.waveImpact(x,z,strength);return {name:spec.name,calibre:spec.caliberMm,strength};
};
window.waveAdvance=(seconds,fps=60)=>{for(let i=0;i<Math.round(seconds*fps);i++)window.draw({time:current.time+1/fps});return post.waterWaves.stats;};
window.waveSwimmer=(x,z,active=true)=>setWaterSwimmer(scene,x,z,active);
window.waveRead=(cx=0,cz=0)=>{
 const target=post.waterWaves.target;if(!target)return null;
 const bits=new Uint16Array(target.width*target.height*4);renderer.readRenderTargetPixels(target,0,0,target.width,target.height,bits);
 let min=0,max=0,energy=0,mass=0,radius=0,outside=0,hash=0,foam=0;const bounds=water.uniforms.uWaveBounds.value,origin=post.waterWaves.origin;
 for(let z=0;z<target.height;z++)for(let x=0;x<target.width;x++){
  const i=(z*target.width+x)*4,h=THREE.DataUtils.fromHalfFloat(bits[i]),wx=origin.x+(x+.5)*32/target.width,wz=origin.y+(z+.5)*32/target.height;
  const froth=THREE.DataUtils.fromHalfFloat(bits[i+2]);if(!Number.isFinite(h)||!Number.isFinite(froth)||froth<0||froth>.801)throw Error('Invalid wave or foam');foam+=froth;min=Math.min(min,h);max=Math.max(max,h);energy+=h*h;mass+=Math.abs(h);radius+=Math.abs(h)*Math.hypot(wx-cx,wz-cz);
  if(wx<bounds.x||wx>bounds.z||wz<bounds.y||wz>bounds.w)outside+=Math.abs(h);hash=(Math.imul(hash,31)+bits[i])|0;
 }
 const sx=Math.floor((cx-origin.x)/32*target.width),sz=Math.floor((cz-origin.y)/32*target.height);
 return {min,max,energy,foam,radius:radius/Math.max(mass,1e-10),outside,hash,sample:THREE.DataUtils.fromHalfFloat(bits[(sz*target.width+sx)*4]),glError:renderer.getContext().getError(),stats:post.waterWaves.stats};
};
window.waveBenchmark=async()=>{
 const result=[];
 for(const detail of ['high','ultra']){
  window.draw({detail});for(let i=0;i<10;i++)window.draw({time:current.time+1/60});
  const samples=[];let state;
  for(let i=0;i<40;i++){await new Promise(requestAnimationFrame);if(i%15===0)window.waveImpact(-30,20,1.5);const start=performance.now();state=window.draw({time:current.time+1/60});renderer.getContext().finish();samples.push(performance.now()-start);}
  samples.sort((a,b)=>a-b);result.push({detail,...state,waves:post.waterWaves.stats,medianMs:samples[20],p95Ms:samples[37]});
 }return result;
};
window.recordWaves=async()=>{
 window.waveReset();window.waveImpact(-30,20,1.5);
 const stream=renderer.domElement.captureStream(30),chunks=[];
 const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:5000000});
 recorder.ondataavailable=e=>chunks.push(e.data);const done=new Promise(resolve=>recorder.onstop=resolve);recorder.start();
 for(let i=0;i<150;i++){if(i===35)window.waveImpact(-28.7,19.5,1.2);if(i===70)window.waveImpact(-31,19,1);window.draw({time:current.time+1/30});await new Promise(r=>setTimeout(r,1000/30));}
 recorder.stop();await done;stream.getTracks().forEach(t=>t.stop());
 return await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(new Blob(chunks,{type:'video/webm'}));});
};
window.boatRun=(seconds=3,fps=60,speed=4)=>{
 for(let i=1;i<=seconds*fps;i++){window.boatPose(0,6-speed*i/fps,0,speed);window.waveAdvance(1/fps,fps);}
 return window.waveRead();
};
window.boatPreview=async(record=false)=>{
 window.waveReset();window.boatPose(-29,22,0,4);window.boatPose(-23,18,Math.PI,3,1);
 window.move(-21,7,29,-29,0,22);
 let stream,recorder,done,chunks=[];
 if(record){stream=renderer.domElement.captureStream(30);recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:5000000});recorder.ondataavailable=e=>chunks.push(e.data);done=new Promise(resolve=>recorder.onstop=resolve);recorder.start();}
 let x=-29,z=22;
 for(let i=0;i<210;i++){
  const t=i/30,yaw=Math.max(0,t-3)*.24;
  x-=Math.sin(yaw)*4/30;z-=Math.cos(yaw)*4/30;
  window.boatPose(x,z,yaw,4);window.boatPose(-23,18+t*3,Math.PI,3,1);
  setWaterSwimmer(scene,x+3,z+2,true);
  if(i===100||i===140)window.waveImpact(x-2,z+4);
  camera.position.set(x+7,4,z+8);camera.lookAt(x,0,z+1);
  window.waveAdvance(1/30,30);
  if(record)await new Promise(r=>setTimeout(r,1000/30));
 }
 setWaterSwimmer(scene,0,0,false);
 if(!record)return post.waterWaves.stats;
 recorder.stop();await done;stream.getTracks().forEach(t=>t.stop());
 return await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(new Blob(chunks,{type:'video/webm'}));});
};
window.boatBenchmark=async()=>{
 const results=[];window.move(-22,6,23,-29,0,15);
 for(const detail of ['high','ultra'])for(const moving of [false,true]){
  window.waveReset();window.draw({detail});const times=[];
  for(let i=0;i<100;i++){
   const t=i/60;window.boatPose(-29,18-(moving?t*4:0),0,moving?4:0);window.boatPose(-25,10+(moving?t*3:0),Math.PI,moving?3:0,1);
   setWaterSwimmer(scene,-27,18-t,true);if(moving&&i%20===0)window.waveImpact(-28,16);
   await new Promise(requestAnimationFrame);const start=performance.now();const state=window.draw({time:current.time+1/60});renderer.getContext().finish();
   if(i>=20)times.push(performance.now()-start);

  }
