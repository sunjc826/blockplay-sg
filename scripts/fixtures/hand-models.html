<!doctype html><meta charset="utf-8"><title>Hand models</title>
<!-- The gun hands and the free hands, for checking shape by eye.
     ?weapon=0..4 through the hip camera, &yaw=&pitch= to orbit the gun (radians), &zoom= to close in on the grip, &reload=0..1 for a reload frame.
     ?free=1 shows the two free hands instead, &grip=0..1 &pinch=0..1.
     ?mantle=0..1 shows the climb through the eye at that fraction of it, &lift= ledge height, &vault=1, &look= pitch. -->
<style>body{margin:0;background:#83969e}canvas{display:block}</style>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {GLTFLoader} from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
import {FPS_WEAPONS} from '/src/game/fps-rules.ts';
import {buildServiceWeapon} from '/src/game/service-weapon-models.ts';
import {createWeaponHandling} from '/src/game/fps-viewmodel.ts';
import {createViewmodelHand} from '/src/game/fps-viewmodel-hand.ts';
import {dressWeapon} from '/src/game/armory-visuals.ts';
import {createProfile,resolveLoadout} from '/src/game/armory-state.ts';
const q=new URLSearchParams(location.search),n=(k,d=0)=>Number(q.get(k)??d);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#83969e');scene.add(new THREE.HemisphereLight('#e4efff','#576350',2.1));const key=new THREE.DirectionalLight('#fff4dd',2.5);key.position.set(1,2,1);scene.add(key);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.01,10);
if(q.has('mantle')){
  const {createMantleHands}=await import('/src/game/fps-mantle-hands.ts'),{createMantle,startMantle,advanceMantle}=await import('/src/game/fps-mantle.ts');
  const lift=n('lift',1.5),vault=q.has('vault'),state=createMantle(),from={x:0,y:0,z:0};
  startMantle(state,from,{x:0,y:lift,z:vault?-1.4:-.85,vault,lip:{x:0,y:vault?lift-.1:lift,z:-.5}},1);
  const feet=advanceMantle(state,state.duration*Math.min(.999,n('mantle')));
  // A stand-in ledge in the same scene, so the planted hands can be judged against it.
  const ledge=new THREE.Mesh(new THREE.BoxGeometry(3,vault?lift-.1:lift,vault?.3:3),new THREE.MeshStandardMaterial({color:'#8d8a80'}));ledge.position.set(0,(vault?lift-.1:lift)/2,vault?-.56:-1.91);scene.add(ledge);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#5d6b52'}));ground.rotation.x=-Math.PI/2;scene.add(ground);
  camera.rotation.order='YXZ';camera.position.set(feet.x,feet.y+1.62,feet.z);camera.rotation.set(n('look'),0,0);camera.updateMatrixWorld(true);
  const holder=new THREE.Group();scene.add(holder);holder.position.copy(camera.position);holder.quaternion.copy(camera.quaternion);
  const {mantleMotion}=await import('/src/game/fps-mantle-hands.ts');const lean=mantleMotion(state);camera.rotation.x+=lean.pitch;camera.rotation.z=lean.roll;camera.updateMatrixWorld(true);holder.quaternion.copy(camera.quaternion);
  const hands=createMantleHands(holder);window.motion=hands.update(state,camera);
}else if(q.has('free')){
  const m=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8}),kit={glove:m('#474b39'),pad:m('#202722'),sleeve:m('#626a50'),mesh(into,g,mat,x=0,y=0,z=0){const o=new THREE.Mesh(g,mat);o.position.set(x,y,z);into.add(o);return o;}};
  const pivot=new THREE.Group();pivot.position.set(0,0,-.3);pivot.rotation.set(n('pitch'),n('yaw'),0);scene.add(pivot);
  [false,true].forEach(left=>{const h=createViewmodelHand(left,kit);h.setGrip(n('grip',.2),n('pinch'));h.group.position.x=left?-.07:.07;pivot.add(h.group);});
}else{
  const index=n('weapon'),spec=FPS_WEAPONS[index];
  document.title=spec.id;const model=index<2?(await new GLTFLoader().loadAsync('/models/field-kit/'+spec.id+'.glb')).scene:buildServiceWeapon(spec.id);
  dressWeapon(model,resolveLoadout(createProfile()).weapons[index]??spec);const handling=createWeaponHandling(model,index);handling.update(q.has('reload')?n('reload'):null,false);
  const rig=new THREE.Group();rig.add(model);rig.position.set(.20,-.32,-.78);rig.rotation.set(n('pitch'),n('yaw'),0);scene.add(rig);
  if(q.has('side')){const h=model.getObjectByName(q.get('hand')==='left'?'reload-hand-left':'reload-hand-right').getWorldPosition(new THREE.Vector3()),d={R:[1,.15,.25],L:[-1,.15,.25],T:[.01,1,.2],F:[0,.1,-1],B:[.25,.5,1]}[q.get('side')],r=n('dist',.45);
    if(q.has('both')){h.lerp(model.getObjectByName('reload-hand-left').getWorldPosition(new THREE.Vector3()),.5);}
    camera.position.copy(h).add(new THREE.Vector3(...d).normalize().multiplyScalar(r));camera.fov=40;camera.lookAt(h);camera.updateProjectionMatrix();}
  if(q.has('zoom')){camera.fov=65/n('zoom',1);camera.lookAt(.2+n('cx'),-.32+n('cy'),-.78);camera.updateProjectionMatrix();}
}
renderer.render(scene,camera);window.ready=true;
</script>
