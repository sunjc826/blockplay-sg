<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ammo placement test</title><style>html,body,#stage{margin:0;height:100%;overflow:hidden}#world,#overlay{position:absolute;inset:0}#world{height:100%!important}#overlay{pointer-events:none;z-index:2}#start{position:absolute;z-index:20;left:16px;top:16px;padding:16px}</style></head><body><div id="stage" class="fps-game"><div id="world" class="fps-viewport"><div id="overlay"></div></div><button id="start">Enter carrier test</button></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import '/src/styles.css';
import { createFpsEngine } from '/src/game/fps-engine.ts';
import { createProfile, resolveLoadout } from '/src/game/armory-state.ts';
import FpsWeaponHud from '/src/components/FpsWeaponHud.tsx';
import { createPooledLoadout } from '/src/game/ammo-pools.ts';
import { createExpeditionLoot } from '/src/game/expedition-loot.ts';
import { TUTORIAL_DISTRICT } from '/src/game/tutorial-course.ts';
import TouchControls from '/src/components/TouchControls.tsx';
const root=createRoot(document.getElementById('overlay')), params=new URLSearchParams(location.search);
const profile=createProfile(); profile.rig=params.get('rig')||'rig-atlas';profile.owned.push(profile.rig);
const family=Number(params.get('family')||0);profile.carry.main=family;
// Freeze only the fixture clock while a screenshot captures a short gesture.
const nativeFrame=window.requestAnimationFrame.bind(window);let frameTime=0;
window.requestAnimationFrame=callback=>nativeFrame(time=>{if(!window.freezeMotion)frameTime=time;callback(frameTime);if(window.capturePlacement && JSON.parse(document.querySelector('#world canvas')?.dataset.ammoPlacement||'{}').animation?.phase==='carry'){window.freezeMotion=true;window.capturePlacement=false;}});
const equipment=resolveLoadout(profile), pickup=params.has('pickup');
const ammunition=createPooledLoadout(equipment.weapons,equipment.carriedFamilies);
if(pickup) for(const slot of [0,1,3]) ammunition[family].magazineInventory.slots[slot]=null;
const loot=createExpeditionLoot('ammo-animation-review'), at=TUTORIAL_DISTRICT.spawn;
if(pickup) for(let i=0;i<20;i++){
 const items=loot.supply('marina-bay',`review-${i}`,{x:at.x+.6,z:at.z-2.3});
 if(items.some(item=>item.kind==='ammo' && item.caliberMm===equipment.weapons[family].caliberMm)) break;
 for(const item of items) loot.collect('marina-bay',item.id,{x:item.x,z:item.z,y:0});
}
const expedition=pickup?{zone:'marina-bay',profile,spawn:at,loot:{...loot,enterZone:()=>loot.remaining('marina-bay')},
 checkpoint:{health:100,armor:0,weapon:family,ammunition},onTravel:()=>{},onEquipment:()=>{},onVendorPurchase:()=>({ok:false,message:'Fixture'})}:undefined;
window.engine=createFpsEngine(document.getElementById('world'),hud=>{
  window.hud=structuredClone(hud);
  const touch=hud.inputMode==='touch';document.getElementById('stage').dataset.touch=touch?'on':'off';
  root.render(React.createElement(React.Fragment,null,
    React.createElement(FpsWeaponHud,{hud,weapon:equipment.weapons[hud.weapon],canFight:hud.phase==='playing',touch}),
    touch?React.createElement(TouchControls,{hud,engine:window.engine??null,mode:'range',onMenu:()=>window.engine.pause()}):null));
},{loadout:equipment,tutorial:true,combat:false,expedition,deploymentIntro:false});
document.getElementById('start').onclick=()=>{window.engine.start();document.getElementById('start').style.display='none';};
</script></body></html>
