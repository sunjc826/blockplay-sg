<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Marina layout review</title><style>html,body,#world{margin:0;width:100%;height:100%;overflow:hidden;background:#111}canvas{display:block}</style></head><body><div id="world"></div><script type="module">
// Layout review for Marina Bay. ?cam=x,y,z&at=x,y,z for a perspective view,
// ?top=x,z,span for a plan view (north up, so −z is at the top of the frame).
import * as THREE from 'three';
import {buildMarinaScene} from '/src/game/marina-scene.ts';
const params=new URLSearchParams(location.search), numbers=key=>params.get(key)?.split(',').map(Number);
const world=buildMarinaScene(),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;
document.querySelector('#world').append(renderer.domElement);
world.scene.fog=null;
let camera;
const top=numbers('top');
if(top){
  const [x,z,span]=top,aspect=innerWidth/innerHeight;
  camera=new THREE.OrthographicCamera(-span*aspect/2,span*aspect/2,span/2,-span/2,1,900);
  camera.position.set(x,400,z);camera.up.set(0,0,-1);camera.lookAt(x,0,z);
}else{
  camera=new THREE.PerspectiveCamera(Number(params.get('fov')??55),innerWidth/innerHeight,.05,1500);
  camera.position.set(...(numbers('cam')??[-26,30,80]));camera.lookAt(...(numbers('at')??[0,0,-12]));
}
window.world=world;
// The frame is copied to an image too: some embedded browsers screenshot a WebGL canvas as black.
const still=new Image();still.style.cssText='position:absolute;inset:0;width:100%;height:100%';document.body.append(still);
window.show=()=>{world.animate(0);renderer.render(world.scene,camera);still.src=renderer.domElement.toDataURL('image/jpeg',.9);return renderer.info.render;};
window.show();window.ready=true;
</script></body></html>
