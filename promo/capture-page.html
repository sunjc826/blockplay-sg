<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>blockplaySG promo capture</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a8cde8; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    // Served by the Vite dev server so it can import the real game scenes.
    // Driven by promo/capture.mjs through window.__promo. No game logic here,
    // just the same renderer settings the three region games use.
    import * as THREE from 'three';

    const builders = {
      'marina-bay': async () => (await import('/src/game/marina-scene.ts')).buildMarinaScene(),
      'queenstown': async () => (await import('/src/game/queenstown-scene.ts')).buildQueenstownScene(),
      'raffles-place': async () => (await import('/src/game/raffles-scene.ts')).buildRafflesScene(),
    };

    const level = new URLSearchParams(location.search).get('level') || 'marina-bay';
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 1400);
    camera.rotation.order = 'YXZ';
    const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / Math.max(1, innerHeight); camera.updateProjectionMatrix(); };
    addEventListener('resize', resize); resize();

    const world = await builders[level]();
    document.body.style.background = `#${world.scene.background.getHexString()}`;

    const smooth = t => t * t * (3 - 2 * t);
    const lerp = (a, b, t) => a + (b - a) * t;
    const pose = (keyframes, t) => {
      // Piecewise interpolation between keyframes, eased inside each segment.
      const last = keyframes[keyframes.length - 1];
      if (t >= last.t) return last;
      let i = 0; while (keyframes[i + 1].t <= t) i++;
      const a = keyframes[i], b = keyframes[i + 1], k = smooth((t - a.t) / (b.t - a.t));
      return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), z: lerp(a.z, b.z, k), yaw: lerp(a.yaw, b.yaw, k), pitch: lerp(a.pitch, b.pitch, k) };
    };
    const apply = p => { camera.position.set(p.x, p.y, p.z); camera.rotation.set(p.pitch, p.yaw, 0, 'YXZ'); };
    let current = null, frames = 0;
    const draw = seconds => { world.animate(seconds); renderer.render(world.scene, camera); frames++; };

    window.__promo = {
      level,
      frames: () => frames,
      setFov(fov) { camera.fov = fov; camera.updateProjectionMatrix(); },
      /** Hold a single pose and render it once. Used for stills and the first video frame. */
      hold(p) { current = p; apply(p); draw(0); },
      /** Play keyframes in wall-clock time, resolving when the last keyframe is reached. */
      run(keyframes) {
        return new Promise(resolve => {
          const started = performance.now();
          const tick = now => {
            const t = (now - started) / 1000;
            apply(pose(keyframes, t)); draw(t);
            if (t >= keyframes[keyframes.length - 1].t) { resolve(frames); return; }
            requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        });
      },
    };
    // Warm up shaders and shadow maps before the caller starts recording.
    apply(keyframesFallback()); draw(0);
    function keyframesFallback() { return { x: 0, y: 1.75, z: 60, yaw: 0, pitch: 0.14 }; }
    window.__promoReady = true;
  </script>
</body>
</html>
